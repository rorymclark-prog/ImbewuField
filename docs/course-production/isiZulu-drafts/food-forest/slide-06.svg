<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Ama-Layer Ayisikhombisa</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="242.1">Ama-Layer Ayisikhombisa</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="309.3">I-canopy ende ikhula ku-10m+.</tspan></text><circle cx="108" cy="358.7" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="370.7">I-sub-canopy ikhula ku-4–8m, kanti ama-shrub akhula</tspan><tspan x="150" y="422.7">ku-1–3m.</tspan></text><circle cx="108" cy="463.9" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="475.8">Izitshalo ze-herbaceous zihlala ngaphansi kuka-1m.</tspan></text><circle cx="108" cy="517" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="529">I-ground cover ivikela umhlabathi, ama-root crops akhula</tspan><tspan x="150" y="581">ngaphansi, kanti ama-climbers asebenzisa i-vertical space.</tspan></text><circle cx="108" cy="622.2" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="634.1">Ngayinye inendawo yayo ukuze ukukhanya nomswakama</tspan><tspan x="150" y="686.1">kusetshenziswe kahle.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="480" height="8" fill="#B07A1E"/></svg>
