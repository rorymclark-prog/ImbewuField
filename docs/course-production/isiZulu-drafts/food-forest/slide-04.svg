<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Ihlathi Lisebenzisa Wonke Ama-Layer</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">4 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="290">Ihlathi Lisebenzisa Wonke</tspan><tspan x="96" y="370.8">Ama-Layer</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="438">Ihlathi lomdabu ligcwalisa indawo kusukela emagatsheni</tspan><tspan x="96" y="499">aphezulu kakhulu kuze kufike ezimpandeni.</tspan></text><circle cx="108" cy="548.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="560.4">Izitshalo ezahlukene zisebenzisa ukukhanya nomswakama</tspan><tspan x="150" y="612.4">okutholakala ezingeni lazo.</tspan></text><circle cx="108" cy="653.6" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="665.5">I-food forest ilingisa le ndlela isebenzisa izinhlobo ezikhiqizayo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="320" height="8" fill="#B07A1E"/></svg>
