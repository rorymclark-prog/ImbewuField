<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Tshala Ngokulandelana</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="239.2">Tshala Ngokulandelana</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="308.1">I-food forest itshalwa ngokulandelana, hhayi</tspan><tspan x="96" y="370.6">ngesikhathi esisodwa.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="433.4">Kuqala ama-nitrogen-fixing pioneers ukuze athuthukise</tspan><tspan x="150" y="486.7">umhlabathi futhi anikeze umthunzi.</tspan></text><circle cx="108" cy="528.9" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="541.1">Bese kutshalwa izihlahla zezithelo eziyinhloko ze-canopy</tspan><tspan x="150" y="594.4">ne-sub-canopy.</tspan></text><circle cx="108" cy="636.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="648.9">Ama-layer aphansi alandela lapho i-canopy isinikeza</tspan><tspan x="150" y="702.2">ukuvikeleka.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1120" height="8" fill="#B07A1E"/></svg>
