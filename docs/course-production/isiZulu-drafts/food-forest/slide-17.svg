<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Iminyaka Yesibili Kuya Kwesine</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">17 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="249.5">Iminyaka Yesibili Kuya Kwesine</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="316.7">Ngonyaka wesibili, tshala izihlahla eziyinhloko zezithelo.</tspan></text><circle cx="108" cy="366.1" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="378">Tshala i-comfrey ne-wild garlic phakathi kwazo, ngaphansi</tspan><tspan x="150" y="430.1">kwazo.</tspan></text><circle cx="108" cy="471.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="483.2">Eminyakeni yesithathu kuya kowesine, nciphisa ama-pioneers</tspan><tspan x="150" y="535.2">ngoba ngaphandle kwalokho azoqhudelana kakhulu</tspan><tspan x="150" y="587.2">ngokukhanya nezihlahla zezithelo esezikhulayo.</tspan></text><circle cx="108" cy="628.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="640.4">Sebenzisa ama-cuttings ama-pioneers njenge-mulch, ukuze</tspan><tspan x="150" y="692.4">umsebenzi wawo wokwakha umhlabathi uqhubeke.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1360" height="8" fill="#B07A1E"/></svg>
