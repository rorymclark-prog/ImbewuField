<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Khetha Ngokwesifunda Sakho</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">9 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="268.2">Khetha Ngokwesifunda</tspan><tspan x="96" y="360.8">Sakho</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="437.9">I-mango encane ingalimala kakhulu yisithwathwa;</tspan><tspan x="96" y="507.8">indawo evikelekile ayiqinisekisi ukuvikeleka.</tspan><tspan x="96" y="577.8">I-quince cultivar ingadinga amakhaza asebusika</tspan><tspan x="96" y="647.7">indawo yakho engenawo. Cela umlimi wendawo</tspan><tspan x="96" y="717.7">noma i-nursery ihlole ukufaneleka.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="720" height="8" fill="#B07A1E"/></svg>
