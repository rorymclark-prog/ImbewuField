<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Khetha Ngokwesifunda Sakho</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">9 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="239.2">Khetha Ngokwesifunda Sakho</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="308.1">Qondanisa uhlobo ngalunye nesifunda salo ngaphambi</tspan><tspan x="96" y="370.6">kokutshala.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="433.4">Yazi imvula yakho, i-minimum winter temperature, ukuthi</tspan><tspan x="150" y="486.7">isithwathwa sivela kangaki, ne-summer humidity.</tspan></text><circle cx="108" cy="528.9" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="541.1">I-mango ekhula kahle ogwini lwase-KZN iyafa lapho kufika</tspan><tspan x="150" y="594.4">isithwathwa sokuqala sase-Highveld.</tspan></text><circle cx="108" cy="636.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="648.9">I-quince edinga i-winter chill ayitheli izithelo endaweni</tspan><tspan x="150" y="702.2">yasogwini engenaso isithwathwa.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="720" height="8" fill="#B07A1E"/></svg>
