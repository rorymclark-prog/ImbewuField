<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Unyaka Wokuqala Epulazini Elingu-500m²</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="243.8">Unyaka Wokuqala Epulazini</tspan><tspan x="96" y="332.5">Elingu-500m²</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="406.3">Uma i-sheet mulch ifanele indawo, sebenzisa</tspan><tspan x="96" y="473.2">amakhadibhodi ahlanzekile angafakwanga</tspan><tspan x="96" y="540.2">ungqimba olucwebezelayo, ususe i-tape</tspan><tspan x="96" y="607.1">nama-staple, uwamboze nge-mulch efanele.</tspan><tspan x="96" y="674.1">Vumela amanzi afike emhlabathini, ugcine iziqu</tspan><tspan x="96" y="741.1">zezihlahla zingamboziwe.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1280" height="8" fill="#B07A1E"/></svg>
