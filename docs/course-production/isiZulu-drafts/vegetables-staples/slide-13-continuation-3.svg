<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Izitshalo Eziyisisekelo Ezahlukene Zivikela Kokuhlukene</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="241.3">Izitshalo Eziyisisekelo</tspan><tspan x="96" y="326.1">Ezahlukene Zivikela</tspan><tspan x="96" y="410.8">Kokuhlukene</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="481.3">Amadumbe abhekana nomhlaba omanzi kakhulu,</tspan><tspan x="96" y="545.3">lapho ezinye izitshalo eziyisisekelo zisebenza</tspan><tspan x="96" y="609.3">kanzima khona.</tspan></text><circle cx="108" cy="661.1" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="673.6">Qaphela ukuthi zehluleka ezimeni ezahlukene. Yilokho</tspan><tspan x="150" y="728.2">okuyinhloso yonke.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1155.6" height="8" fill="#B07A1E"/></svg>
