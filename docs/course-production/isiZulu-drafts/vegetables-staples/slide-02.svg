<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Kungani Lokhu Kubalulekile</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="84.5" fill="#F7F2E9"><tspan x="96" y="249">Kungani Lokhu Kubalulekile</tspan></text><text class="lead" font-size="57.6" fill="#F7F2E9"><tspan x="96" y="327.7">Ake siqale ngenkinga.</tspan></text><circle cx="108" cy="385.6" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="399.6">Ukutshala okukhulu kanye kunikeza ukugcwala</tspan><tspan x="150" y="460.5">okweqile (glut). Konke kuvuthwa ngasikhathi sinye.</tspan><tspan x="150" y="521.4">Udla lokho okungakwazi, unikeze abanye okunye,</tspan><tspan x="150" y="582.3">kanti okusalayo kuyamoshakala.</tspan></text><circle cx="108" cy="630.5" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="644.5">Emva kwalokho kufika igebe. Akukho okuvuthiwe.</tspan><tspan x="150" y="705.4">Igadi igcwele izitshalo, kodwa akukho ukudla kuyo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="177.8" height="8" fill="#E3B65C"/></svg>
