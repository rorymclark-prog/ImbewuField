<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isigqi Sokutshala Sigcina Ukudla Kuqhubeka</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="240.8">Isigqi Sokutshala Sigcina Ukudla</tspan><tspan x="96" y="321.7">Kuqhubeka</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="388.9">Ukutshala ngokulandelana kuwumkhuba wekhalenda.</tspan><tspan x="96" y="449.9">Khetha isitshalo esidliwa njalo ekhaya, bese uhlwanyela</tspan><tspan x="96" y="510.9">kancane ngezikhawu.</tspan></text><circle cx="108" cy="560.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="572.2">Amasonto amabili kuya kwamathathu angaba yisigqi sokuqala</tspan><tspan x="150" y="624.3">sezitshalo ezifanele, hhayi umthetho wesitshalo noma wesizini</tspan><tspan x="150" y="676.3">ngayinye. Hlola izinsuku kuze kuvunwe, ubhale okwenzeka</tspan><tspan x="150" y="728.3">ngempela.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="711.1" height="8" fill="#B07A1E"/></svg>
