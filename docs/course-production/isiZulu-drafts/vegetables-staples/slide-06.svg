<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Imbewu Noma Isithombo?</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="245.1">Imbewu Noma Isithombo?</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="314">Ezinye izitshalo azizithandi ukuphazanyiswa</tspan><tspan x="96" y="376.5">kwezimpande zazo. Zikhula kangcono uma zitshalwa</tspan><tspan x="96" y="439">ngqo lapho ezizokhulela khona. Izimbotyi, ukhathoni</tspan><tspan x="96" y="501.5">nommbila bakulelo qembu.</tspan></text><circle cx="108" cy="552.1" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="564.3">Ezinye zikhula kangcono uma ziqala endaweni evikelekile —</tspan><tspan x="150" y="617.6">inaseli (nursery) — bese kamuva zisuselwa (transplanted).</tspan><tspan x="150" y="670.9">Amatamatisi nezitshalo zohlobo lwamakhabishi (brassicas —</tspan><tspan x="150" y="724.2">njengekhabishi, ubroccoli, ne-cauliflower) bakulelo qembu.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="533.3" height="8" fill="#B07A1E"/></svg>
