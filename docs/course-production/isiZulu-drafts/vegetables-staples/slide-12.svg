<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Izitshalo Eziyisisekelo Ziwuvikelo Lokudla</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="275">Izitshalo Eziyisisekelo</tspan><tspan x="96" y="365.6">Ziwuvikelo Lokudla</tspan></text><text class="lead" font-size="55.2" fill="#20190F"><tspan x="96" y="441.1">Isitshalo esiyisisekelo (staple) sizuza indawo yaso</tspan><tspan x="96" y="509.5">ngoba sondla umuzi ngale kosuku lokuvuna.</tspan></text><circle cx="108" cy="564.9" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="578.3">Sithwala amandla (energy) noma iprotheni. Siyagcinwa,</tspan><tspan x="150" y="636.7">noma sihlale emhlabathini size sikudingeke. Futhi</tspan><tspan x="150" y="695.1">ngokuvamile sithwala nomlando wesiko.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1066.7" height="8" fill="#B07A1E"/></svg>
