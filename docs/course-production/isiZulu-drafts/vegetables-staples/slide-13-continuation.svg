<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Izitshalo Eziyisisekelo Ezahlukene Zivikela Kokuhlukene</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="249.4">Izitshalo Eziyisisekelo</tspan><tspan x="96" y="332.2">Ezahlukene Zivikela</tspan><tspan x="96" y="415">Kokuhlukene</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="483.9">Ummbila unikeza amakhalori, futhi uyagcinwa uwomile.</tspan><tspan x="96" y="546.4">Ummbila wemvelo ovulelekile (open-pollinated maize)</tspan><tspan x="96" y="608.9">uphinde ukuvumele ukuba ugcine imbewu yakho, uma</tspan><tspan x="96" y="671.4">ulawula ibanga lokuhlukanisa (isolation) nokukhetha</tspan><tspan x="96" y="733.9">kwezitshalo ezinhle kunazo zonke (selection).</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1155.6" height="8" fill="#B07A1E"/></svg>
