<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Hlela Usuka Emuva Kusukela Egebeni Lakho Lendlala</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="240.8">Hlela Usuka Emuva Kusukela</tspan><tspan x="96" y="321.7">Egebeni Lakho Lendlala</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="388.9">Yonke indawo inegebe lendlala (hungry gap). Amaviki</tspan><tspan x="96" y="449.9">lapho isivuno sokugcina sesehla khona kanti</tspan><tspan x="96" y="510.9">esilandelayo sisengakalungeli.</tspan></text><circle cx="108" cy="560.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="572.2">Elakho lingafika ngemuva kokuba ummbila ogciniwe</tspan><tspan x="150" y="624.3">usuphelile. Lingafika ngaphambi kokuba imifino yasebusika</tspan><tspan x="150" y="676.3">ilunge. Lingafika ngesikhathi sokoma lapho amanzi</tspan><tspan x="150" y="728.3">elinganisela igadi.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="977.8" height="8" fill="#B07A1E"/></svg>
