<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Izimpande Zidinga Inhlabathi Etshelekile, Izindlela Zidinga Izinyawo Zakho</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">4 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="243.9">Izimpande Zidinga Inhlabathi</tspan><tspan x="96" y="328.7">Etshelekile, Izindlela Zidinga</tspan><tspan x="96" y="413.4">Izinyawo Zakho</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="484">Kusukela kumitha eyodwa kuya kwemitha eyi-1.2</tspan><tspan x="96" y="547.9">ububanzi. Yileyo linani okusetshenziswa ngayo.</tspan><tspan x="96" y="611.9">Ngalobo bubanzi ungafinyelela embili uvela</tspan><tspan x="96" y="675.9">nhlangothi ngalinye, kanti izinyawo zakho azisoze</tspan><tspan x="96" y="739.9">zathinta indawo yokukhulisa izitshalo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="355.6" height="8" fill="#B07A1E"/></svg>
