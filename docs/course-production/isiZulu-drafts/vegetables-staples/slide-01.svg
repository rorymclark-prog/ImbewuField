<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Imifino neZitshalo Eziyisisekelo</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">1 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="77.4" fill="#F7F2E9"><tspan x="96" y="294.5">Imifino neZitshalo Eziyisisekelo</tspan></text><text class="lead" font-size="52.8" fill="#F7F2E9"><tspan x="96" y="366.7">Siyakwamukela. Le ngxenye ikhuluma ngeMifino</tspan><tspan x="96" y="432.2">nezinye iZitshalo Eziyisisekelo. Ingenye yezifundo</tspan><tspan x="96" y="497.6">ezilishumi eziyingxenye yaMabhuku e-ImbewuField.</tspan></text><circle cx="108" cy="550.7" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="563.5">Igadi ekhiqizayo akusiyona leyo ebukeka igcwele kakhulu</tspan><tspan x="150" y="619.3">ngosuku olulodwa. Iyona egcina ukudla kungena emzini,</tspan><tspan x="150" y="675.1">iviki ngeviki.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="88.9" height="8" fill="#E3B65C"/></svg>
