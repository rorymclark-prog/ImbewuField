<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Imiphumela Yokufunda</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="246.8">Imiphumela Yokufunda</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="315.7">Okwesithathu. Khetha izitshalo eziyisisekelo</tspan><tspan x="96" y="378.2">ezikuvikelayo uma esinye isitshalo sisehluleka.</tspan></text><circle cx="108" cy="428.8" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="441">Okwesine. Funda inkinga yezinambuzane ngaphambi kokuba</tspan><tspan x="150" y="494.3">uyelaphe.</tspan></text><circle cx="108" cy="536.5" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="548.7">Lezi zine zihambisana ndawonye. Ibhedi eyakhiwe kahle</tspan><tspan x="150" y="602">isengahluleka uma konke kutshalwa ngosuku olulodwa.</tspan><tspan x="150" y="655.3">Ukutshala okuxubene nakho kusengaba nzima uma uphatha</tspan><tspan x="150" y="708.6">wonke amaqabunga aphuzi njengenkinga yesinambuzane.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="266.7" height="8" fill="#E3B65C"/></svg>
