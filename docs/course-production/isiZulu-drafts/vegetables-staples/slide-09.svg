<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Tshala Kancane Futhi Njalo</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">9 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="252">Tshala Kancane Futhi Njalo</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="329.1">Hlwanyela iqoqo elincane, ubhale usuku, bese</tspan><tspan x="96" y="399">uhlwanyela elilandelayo lapho isitshalo nesizini</tspan><tspan x="96" y="469">kudinga khona.</tspan></text><circle cx="108" cy="525.6" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="539.3">Esibonelweni sezikhawu zamasonto amabili kuya</tspan><tspan x="150" y="598.9">kwamathathu, ukuhlwanyela okune kuzoba sezigabeni</tspan><tspan x="150" y="658.5">ezahlukene. Okokuqala akulungeli ukuvunwa</tspan><tspan x="150" y="718.2">ngokuzenzakalela lapho kutshalwa okwesine.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="800" height="8" fill="#B07A1E"/></svg>
