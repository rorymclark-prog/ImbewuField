<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Hlobo Umumo Wokusebenza</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">7 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="243.8">Hlobo Umumo Wokusebenza</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="312.7">Ngaphambi kokutshala, hlobo ibhedi ngaphambili.</tspan></text><circle cx="108" cy="363.3" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="375.5">Imitha eyi-1.2 ububanzi. Imitha ezintathu ubude. Ibhedi</tspan><tspan x="150" y="428.8">eyodwa yokuzijwayeza.</tspan></text><circle cx="108" cy="471" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="483.3">Sebenzisa izinsimbi (pegs) nentambo. Hlobo isikwele</tspan><tspan x="150" y="536.5">esiyirekthangeli, uphinde uhlobo zombili izindlela zokungena.</tspan></text><circle cx="108" cy="578.7" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="591">Bese ulungisa ngokohlobo lwenhlabathi yakho — qala</tspan><tspan x="150" y="644.3">ngendlela engagujwa phansi (no-dig), ubuye ugubhe ujule</tspan><tspan x="150" y="697.6">kuphela uma umhlaba wakho ngempela udinga lokho.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="622.2" height="8" fill="#B07A1E"/></svg>
