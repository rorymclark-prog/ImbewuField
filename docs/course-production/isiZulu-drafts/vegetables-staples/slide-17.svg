<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Umsebenzi Wasensimini</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">17 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="243.8">Umsebenzi Wasensimini</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="312.7">Manje isifundo siphela enhlabathini.</tspan></text><circle cx="108" cy="363.3" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="375.5">Yakha ibhedi eyodwa engakugcina ukudla. Imitha eyi-1.2</tspan><tspan x="150" y="428.8">ngemitha ezintathu.</tspan></text><circle cx="108" cy="471" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="483.3">Finyelela embili uvela nhlangothi zombili. Gcina zonke</tspan><tspan x="150" y="536.5">izinyawo ezindleleni. Beka izitshalo zakho ngebanga elifanele</tspan><tspan x="150" y="589.8">isimo sezulu sendawo yakho. Fulela ibhedi ngophoyi (mulch).</tspan></text><circle cx="108" cy="632" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="644.3">Yinike okungenani izinsuku eziyishumi ngaphambi kokuba</tspan><tspan x="150" y="697.6">uyahlulele.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1511.1" height="8" fill="#E3B65C"/></svg>
