<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isitshalo Ngasinye Masenze Umsebenzi Waso</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">18 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="88" fill="#1F4D2B"><tspan x="96" y="257">Isitshalo Ngasinye</tspan><tspan x="96" y="355.6">Masenze Umsebenzi Waso</tspan></text><text class="lead" font-size="60" fill="#20190F"><tspan x="96" y="437.6">Nikeza isitshalo ngasinye se-guild umsebenzi</tspan><tspan x="96" y="512">ocacile nendawo eyanele yokuwenza.</tspan></text><circle cx="108" cy="572.2" r="9" fill="#B07A1E"/><text class="point" font-size="52" fill="#3A3020"><tspan x="150" y="586.8">Isitshalo esimboza umhlabathi singawuvikela sinike</tspan><tspan x="150" y="650.2">nokudla, kodwa singancintisana nomuthi omncane.</tspan><tspan x="150" y="713.7">Siqhathanise ne-mulch lapho amanzi enganele.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1440" height="8" fill="#B07A1E"/></svg>
