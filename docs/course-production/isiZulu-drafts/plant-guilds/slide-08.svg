<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Lapho Kubekwa Khona Ama-Nitrogen Fixer</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="243.3">Lapho Kubekwa Khona</tspan><tspan x="96" y="330">Ama-Nitrogen Fixer</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="402.2">Beka ama-nitrogen fixer phezulu entabeni noma</tspan><tspan x="96" y="467.6">ohlangothini olufika umoya kuqala, ukuze ukuvunda</tspan><tspan x="96" y="533.1">kwehlele ezihlahleni zezithelo.</tspan></text><circle cx="108" cy="586.1" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="598.9">Ehlathini lokudla, ekuqaleni tshala ama-nitrogen fixer</tspan><tspan x="150" y="654.7">ngobuningi obuphindwe kabili kobezihlahla zezithelo.</tspan></text><circle cx="108" cy="699" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="711.8">Lapho umqhele usuvala, nciphisa ama-nitrogen fixer.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="640" height="8" fill="#B07A1E"/></svg>
