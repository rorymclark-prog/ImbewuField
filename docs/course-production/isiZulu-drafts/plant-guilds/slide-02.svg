<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Kungani Ama-Plant Guild Ebalulekile</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="240.8">Kungani Ama-Plant Guild</tspan><tspan x="96" y="321.7">Ebalulekile</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="388.9">Uma umhlabathi usukhathele, thola okuvimbela</tspan><tspan x="96" y="449.9">ukukhula. Amanzi, ukwakheka komhlabathi</tspan><tspan x="96" y="510.9">nezakhamzimba ezahlukene konke kungaba nomthelela.</tspan></text><circle cx="108" cy="560.3" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="572.2">Ama-legumes angabopha i-nitrogen ngokusebenzisana</tspan><tspan x="150" y="624.3">nama-rhizobia. I-mulch ibuyisela izinsalela zezitshalo</tspan><tspan x="150" y="676.3">emhlabathini, kanti izimbali zingasekela izinambuzane</tspan><tspan x="150" y="728.3">eziwusizo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="160" height="8" fill="#E3B65C"/></svg>
