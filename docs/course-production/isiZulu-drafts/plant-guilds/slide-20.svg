<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isenzo Sasepulazini</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="86.2" fill="#F7F2E9"><tspan x="96" y="247.6">Isenzo Sasepulazini</tspan></text><text class="lead" font-size="58.8" fill="#F7F2E9"><tspan x="96" y="328">Tshala noma uhlele i-guild eyodwa ezungeze</tspan><tspan x="96" y="400.9">umuthi ophakathi.</tspan></text><circle cx="108" cy="459.9" r="8.8" fill="#E3B65C"/><text class="point" font-size="51" fill="#CFC5AC"><tspan x="150" y="474.2">Khetha i-Sesbania sesban ye-nitrogen lapho izimo</tspan><tspan x="150" y="536.4">zase-KZN ezifudumele nezinomswakama ziyifanele,</tspan><tspan x="150" y="598.6">i-Bocking 14 comfrey ye-chop and drop, i-wild garlic</tspan><tspan x="150" y="660.7">ne-African basil zokulawula izinambuzane, kanye</tspan><tspan x="150" y="722.9">ne-sweet potato yokumboza umhlaba.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
