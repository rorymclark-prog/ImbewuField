<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Sebenza Nezinambuzane Eziwusizo</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="261.1">Sebenza Nezinambuzane</tspan><tspan x="96" y="345.9">Eziwusizo</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="416.4">Ama-ladybird amaningi adla ama-aphid, kanti amanye</tspan><tspan x="96" y="480.4">ama-parasitoid wasp ahlasela ama-caterpillar.</tspan></text><circle cx="108" cy="532.2" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="544.7">Izitshalo eziqhakazayo njenge-African basil, i-borage</tspan><tspan x="150" y="599.3">ne-marigold zingasekela izinambuzane eziwusizo. Bheka</tspan><tspan x="150" y="653.8">izinambuzane ezifika ngempela nokuthi umonakalo</tspan><tspan x="150" y="708.4">ezitshalweni uyashintsha yini.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="960" height="8" fill="#B07A1E"/></svg>
