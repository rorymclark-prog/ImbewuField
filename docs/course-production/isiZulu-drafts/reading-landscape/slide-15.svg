<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Khetha Ukuhamba Komoya Nokufudumala</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">15 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="266.8">Khetha Ukuhamba Komoya</tspan><tspan x="96" y="347.7">Nokufudumala</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="414.9">Beka i-seedling nursery yakho ezwela kakhulu i-frost</tspan><tspan x="96" y="475.9">egqumeni elinothambeka oluncane, elibheke enyakatho,</tspan><tspan x="96" y="536.9">ngaphezu kwendawo lapho i-frost iqoqana khona.</tspan></text><circle cx="108" cy="586.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="598.3">Uma ama-tomatoes ehlaselwa yi-late blight, hambisa umbhede</tspan><tspan x="150" y="650.3">endaweni enokuhamba kahle komoya nelanga lasekuseni.</tspan><tspan x="150" y="702.3">Ilanga lasekuseni lomisa amaqabunga ngokushesha.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1142.9" height="8" fill="#B07A1E"/></svg>
