<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>I-Frost Yehla Ngomthambeka</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="244.2">I-Frost Yehla Ngomthambeka</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="314.7">I-frost iziphatha njengamanzi. Ebusuku, umoya</tspan><tspan x="96" y="378.7">obandayo wehla emthambekeni bese uqoqana</tspan><tspan x="96" y="442.7">ezindaweni eziphansi.</tspan></text><circle cx="108" cy="494.5" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="507">Iphansi lesigodi liba ne-frost emasontweni ambalwa</tspan><tspan x="150" y="561.6">ngaphambi nangemva kwemithambeka engenhla. Isikhala</tspan><tspan x="150" y="616.2">ku-ridgeline singangenisa umoya obandayo amamitha</tspan><tspan x="150" y="670.7">angamakhulu amabili noma amathathu uye esigodini</tspan><tspan x="150" y="725.3">esivikelekile.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1066.7" height="8" fill="#B07A1E"/></svg>
