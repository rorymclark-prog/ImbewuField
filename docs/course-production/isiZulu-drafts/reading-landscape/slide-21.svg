<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isenzo SaseNsimini</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">21 / 21</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="252.4">Isenzo SaseNsimini</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="319.6">Yakha i-A-frame level ngezigxobo ezintathu nentambo</tspan><tspan x="96" y="380.6">eboshelwe isisindo.</tspan></text><circle cx="108" cy="430" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="441.9">Yisebenzise ukulandela ama-contour lines emhlabeni wakho.</tspan><tspan x="150" y="494">Maka lapho uzokwehlisa khona amanzi phezulu, uwafake</tspan><tspan x="150" y="546">emhlabathini maphakathi, bese uwalawula ngezansi.</tspan></text><circle cx="108" cy="587.2" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="599.1">Faka imicibisholo yomoya wasehlobo nowasebusika, okubonile</tspan><tspan x="150" y="651.1">ngemithunzi ngo-8 ekuseni, emini, nango-4 ntambama, kanye</tspan><tspan x="150" y="703.2">nama-zones nama-sectors. Gcina imephu futhi uyibuyekeze.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
