<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Kungani Lokhu Kubalulekile</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 21</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="252.4">Kungani Lokhu Kubalulekile</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="319.6">Ipulazi ngalinye linezindlela zalo ezisebenzayo</tspan><tspan x="96" y="380.6">ngaphambi kokuba sengeze noma yini.</tspan></text><circle cx="108" cy="430" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="441.9">Imvula isivele ilandela imigqa emhlabeni. Ilanga selivele</tspan><tspan x="150" y="494">lifudumeza ezinye izindawo ngaphezu kwezinye. Umoya</tspan><tspan x="150" y="546">usuvele uthola izikhala namagquma, kanti umoya obandayo</tspan><tspan x="150" y="598">usuvele uqoqana emigodini.</tspan></text><circle cx="108" cy="639.2" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="651.1">Uma ufunda lezi zindlela kuqala, ubeka amanzi, izitshalo,</tspan><tspan x="150" y="703.2">izihlahla, nezakhiwo lapho zingasebenzisana khona nomhlaba.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="152.4" height="8" fill="#E3B65C"/></svg>
