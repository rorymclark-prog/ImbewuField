<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isingeniso se-Permaculture</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">1 / 22</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="239.2">Isingeniso se-Permaculture</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="308.1">Ngaphambi kokumba noma yini, kuyasiza ukwazi</tspan><tspan x="96" y="370.6">ukuthi izinqumo zenziwa kanjani.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="433.4">Le module iyisisekelo sakho konke okunye esifundweni.</tspan><tspan x="150" y="486.7">Iqukethe ama-ethics amathathu, ama-design principles,</tspan><tspan x="150" y="540">nendlela elula yokuhlela umhlaba wakho.</tspan></text><circle cx="108" cy="582.2" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="594.4">Akudingi mali. Kodwa kushintsha lapho ubeka khona izinto,</tspan><tspan x="150" y="647.7">nokuthi uhamba ibanga elingakanani nsuku zonke.</tspan></text><circle cx="108" cy="689.9" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="702.2">Bheka indawo yakho. Iyiphi ingxenye oyivakashela kakhulu?</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="72.7" height="8" fill="#E3B65C"/></svg>
