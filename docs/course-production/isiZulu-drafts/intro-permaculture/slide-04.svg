<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Ukunakekela Umhlaba</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">4 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="238.2">Ukunakekela Umhlaba</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="308.7">I-ethic yokuqala yi-Earth Care.</tspan></text><circle cx="108" cy="360.5" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="373">Isho ukuphatha umhlabathi, amanzi, izitshalo nezilwane</tspan><tspan x="150" y="427.6">njengezinhlelo eziphilayo okufanele zivikelwe, hhayi izinto</tspan><tspan x="150" y="482.1">ozisebenzisa uze uziqede.</tspan></text><circle cx="108" cy="525.3" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="537.9">Uhlelo oluqedwa ukusetshenziswa luyayeka ukukusiza.</tspan><tspan x="150" y="592.4">Uhlelo oluvikelwayo luyaqhubeka nokukusiza.</tspan></text><circle cx="108" cy="635.6" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="648.1">Bheka indawo eyodwa yomhlabathi ongenalutho. Kukhona</tspan><tspan x="150" y="702.7">yini okuyivikelayo manje?</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="290.9" height="8" fill="#B07A1E"/></svg>
