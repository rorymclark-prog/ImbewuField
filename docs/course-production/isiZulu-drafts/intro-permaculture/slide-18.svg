<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Ama-Sectors: Amandla Afika Ngaphandle</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">18 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="86.2" fill="#1F4D2B"><tspan x="96" y="261.5">Ama-Sectors: Amandla</tspan><tspan x="96" y="358.1">Afika Ngaphandle</tspan></text><text class="lead" font-size="58.8" fill="#20190F"><tspan x="96" y="438.5">Ama-zones avela ngaphakathi komhlaba</tspan><tspan x="96" y="511.4">wakho. Ama-sectors avela ngaphandle kwawo.</tspan></text><circle cx="108" cy="570.4" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="584.7">Ilanga, umoya, imvula, isikhukhula nomlilo kufika</tspan><tspan x="150" y="646.9">kunqamule umngcele wakho, noma</tspan><tspan x="150" y="709">ungakuhlelelanga.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1309.1" height="8" fill="#B07A1E"/></svg>
