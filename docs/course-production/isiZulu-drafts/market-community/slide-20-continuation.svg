<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isenzo Sasepulazini: Sebenzisa Irekhodi</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="75.7" fill="#F7F2E9"><tspan x="96" y="256.4">Isenzo Sasepulazini: Sebenzisa</tspan><tspan x="96" y="341.2">Irekhodi</tspan></text><text class="lead" font-size="51.6" fill="#F7F2E9"><tspan x="96" y="411.7">Uma irekhodi libonisa igebe lokudla, hlela ubuyele</tspan><tspan x="96" y="475.7">emuva usebenzisa isikhathi sesivuno sesitshalo</tspan><tspan x="96" y="539.7">esifanele, isizini yendawo namanzi atholakalayo.</tspan></text><circle cx="108" cy="591.5" r="7.7" fill="#E3B65C"/><text class="point" font-size="44.7" fill="#CFC5AC"><tspan x="150" y="604">Bese nivumelana nomakhelwane ngokuthengisa endaweni,</tspan><tspan x="150" y="658.5">ukushintshisana imbewu, ukwabelana ithuluzi noma</tspan><tspan x="150" y="713.1">ukushintshisana amakhono okukodwa okusebenzayo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
