<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isizini Eyodwa Iphendula Imibuzo</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="249.5">Isizini Eyodwa Iphendula Imibuzo</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="316.7">Irekhodi lesizini eyodwa liphendula imibuzo ebalulekile.</tspan></text><circle cx="108" cy="366.1" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="378">Yiziphi izitshalo ezinikeza isivuno esingcono embhedeni</tspan><tspan x="150" y="430.1">ngamunye? Yiziphi ezibuyisa imali eningi ngehora</tspan><tspan x="150" y="482.1">lomsebenzi?</tspan></text><circle cx="108" cy="523.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="535.2">Yiziphi ezisebenzisa imbewu, amanzi, ne-compost eningi</tspan><tspan x="150" y="587.2">kunalokho ezikubuyisayo?</tspan></text><circle cx="108" cy="628.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="640.4">Irekhodi libuye libonise izinyanga lapho umuzi ugcina uthenga</tspan><tspan x="150" y="692.4">khona ukudla.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="480" height="8" fill="#B07A1E"/></svg>
