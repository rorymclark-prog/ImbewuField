<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Tshala Ukuvala Igebe Lokudla</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="245">Tshala Ukuvala Igebe Lokudla</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="312.2">Irekhodi lingakhombisa igebe lokudla ngaphambi kokuba</tspan><tspan x="96" y="373.2">kuqale isizini elandelayo.</tspan></text><circle cx="108" cy="422.6" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="434.6">Uma imifino ishoda ngoJuni noJulayi, hlela izitshalo</tspan><tspan x="150" y="486.6">zasebusika ezimelana namakhaza ngoMashi kuya ku-Ephreli.</tspan></text><circle cx="108" cy="527.8" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="539.7">Lokhu akukhona ukuqagela. Izinsuku zivela kwirekhodi lepulazi</tspan><tspan x="150" y="591.7">lakho.</tspan></text><circle cx="108" cy="632.9" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="644.9">Ukutshala ukuvala leli gebe kusiza umuzi udle okuningi</tspan><tspan x="150" y="696.9">kokudla kwawo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="640" height="8" fill="#B07A1E"/></svg>
