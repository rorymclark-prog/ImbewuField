<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Kungani Lokhu Kubalulekile</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="77.4" fill="#F7F2E9"><tspan x="96" y="258.7">Kungani Lokhu Kubalulekile</tspan></text><text class="lead" font-size="52.8" fill="#F7F2E9"><tspan x="96" y="330.9">Iningi labalimi abancane lithengisa ngaphansi</tspan><tspan x="96" y="396.3">kwenani lalokho okukhiqizwa amapulazi abo ngoba</tspan><tspan x="96" y="461.8">abakubhali phansi.</tspan></text><circle cx="108" cy="514.8" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="527.6">Utamatisi, iqanda, noma inyanda ye-morogo ingaya</tspan><tspan x="150" y="583.5">emndenini, kumthengi, kumakhelwane, noma ku-compost.</tspan></text><circle cx="108" cy="627.7" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="640.5">Uma ubhala phansi konke, uyabona ukuthi umhlaba</tspan><tspan x="150" y="696.3">nomsebenzi wakho kwenzani ngempela.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="160" height="8" fill="#E3B65C"/></svg>
