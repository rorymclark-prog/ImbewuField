<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Qondanisa Indlela Nokukhiqiza Kwakho</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="248.1">Qondanisa Indlela Nokukhiqiza</tspan><tspan x="96" y="334.8">Kwakho</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="407">Uma ukukhiqiza kushintsha isonto nesonto,</tspan><tspan x="96" y="472.4">ungathembisi ibhokisi elinenani elingaguquki.</tspan></text><circle cx="108" cy="525.5" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="538.3">Thengisa lokho onakho ngemakethe engakahleleki noma</tspan><tspan x="150" y="594.1">komakhelwane abangafuni ukuzibophezela okungaguquki.</tspan></text><circle cx="108" cy="638.3" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="651.1">Khetha inani elikhokhela izindleko zangempela</tspan><tspan x="150" y="706.9">zokukhiqiza.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1040" height="8" fill="#B07A1E"/></svg>
