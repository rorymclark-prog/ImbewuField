<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Qondanisa Indlela Nokukhiqiza Kwakho</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="256.4">Qondanisa Indlela Nokukhiqiza</tspan><tspan x="96" y="341.2">Kwakho</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="411.7">Uma ukukhiqiza kushintsha isonto nesonto,</tspan><tspan x="96" y="475.7">ungathembisi ibhokisi elinenani elingaguquki ongeke</tspan><tspan x="96" y="539.7">ulikwazi ukuligcwalisa.</tspan></text><circle cx="108" cy="591.5" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="604">Bheka omakhelwane noma izimakethe ezizimisele</tspan><tspan x="150" y="658.5">ukuthenga okusele okukhona ngempela. Qinisekisa izidingo</tspan><tspan x="150" y="713.1">zabo ufake izindleko zokuthengisa esinqumweni sakho.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1040" height="8" fill="#B07A1E"/></svg>
