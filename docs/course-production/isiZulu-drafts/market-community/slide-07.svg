<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Thola Izindleko Zangempela</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">7 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="268.5">Thola Izindleko Zangempela</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="339">Ngaphambi kokubeka inani lokuthengisa, hlanganisa</tspan><tspan x="96" y="403">izindleko zokukhiqiza nokuthengisa leso sivuno.</tspan></text><circle cx="108" cy="454.8" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="467.3">Faka imbewu, amanzi, i-compost, ukupakisha, ukuthutha,</tspan><tspan x="150" y="521.9">izimali zokuthengisa nomsebenzi wakho. Bhala nomkhiqizo</tspan><tspan x="150" y="576.4">ongathengiswanga nokulahleka.</tspan></text><circle cx="108" cy="619.6" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="632.2">Kulesi sibonelo, izindleko zonke zingu-R18/kg kanti inani</tspan><tspan x="150" y="686.7">lokuthengisa lingu-R15/kg. Lelo nani alizikhokheli izindleko.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="560" height="8" fill="#B07A1E"/></svg>
