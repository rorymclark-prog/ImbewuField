<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Thengisa Eduze Ukuze Unciphise Ukulahleka</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">17 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="240.8">Thengisa Eduze Ukuze</tspan><tspan x="96" y="321.7">Unciphise Ukulahleka</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="388.9">Bhala ukuthi umkhiqizo ongakanani uyonakala,</tspan><tspan x="96" y="449.9">awuthengiswa noma ulahleka phakathi kokuvuna</tspan><tspan x="96" y="510.9">nokuthengisa, nokuthi ukulahleka kwenzeka kuphi.</tspan></text><circle cx="108" cy="560.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="572.2">Abathengi abaseduze banganciphisa ukuhamba</tspan><tspan x="150" y="624.3">nokubambezeleka. Abasusi isidingo sokuphatha</tspan><tspan x="150" y="676.3">ngokucophelela, iziqukathi ezihlanzekile, ukugcina okufanele</tspan><tspan x="150" y="728.3">nokuletha ngesikhathi.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1360" height="8" fill="#B07A1E"/></svg>
