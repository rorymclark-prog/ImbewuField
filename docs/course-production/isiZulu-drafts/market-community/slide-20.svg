<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Isenzo Sasepulazini: Sebenzisa Irekhodi</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="238">Isenzo Sasepulazini: Sebenzisa</tspan><tspan x="96" y="318.8">Irekhodi</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="386">Khetha isinqumo esisodwa sangempela sokuthengisa</tspan><tspan x="96" y="447">epulazini lakho.</tspan></text><circle cx="108" cy="496.4" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="508.4">Uma umkhiqizo ubiza kakhulu ukuwukhiqiza kunenani</tspan><tspan x="150" y="560.4">othengiswa ngalo, nyusa inani, yehlisa izindleko, noma</tspan><tspan x="150" y="612.4">uhambise umsebenzi esitshalweni esingcono.</tspan></text><circle cx="108" cy="653.6" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="665.5">Uma kuvela igebe lokudla ngoJuni noJulayi, hlela izitshalo</tspan><tspan x="150" y="717.6">zasebusika ezimelana namakhaza ngoMashi kuya ku-Ephreli.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
