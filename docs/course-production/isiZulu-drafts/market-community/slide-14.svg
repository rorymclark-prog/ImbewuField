<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Buka: Omakhelwane Basqinisa Kanjani Isivuno</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="88" fill="#1F4D2B"><tspan x="96" y="253.5">Buka: Omakhelwane</tspan><tspan x="96" y="352.1">Basqinisa Kanjani Isivuno</tspan></text><text class="lead" font-size="60" fill="#20190F"><tspan x="96" y="434.1">Ipulazi elilodwa lingakhiqiza ukudla.</tspan></text><circle cx="108" cy="494.3" r="9" fill="#B07A1E"/><text class="point" font-size="52" fill="#3A3020"><tspan x="150" y="508.9">Iqembu lingabelana ngembewu, amathuluzi,</tspan><tspan x="150" y="572.3">amakhono, nezindleko zokuthutha.</tspan></text><circle cx="108" cy="622.6" r="9" fill="#B07A1E"/><text class="point" font-size="52" fill="#3A3020"><tspan x="150" y="637.1">Abalimi abahlukene baba inethiwekhi yokudla</tspan><tspan x="150" y="700.6">yasendaweni enamandla.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1120" height="8" fill="#B07A1E"/></svg>
