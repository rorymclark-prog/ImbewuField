<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Linganisa I-Browns Ne-Greens</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="240.5">Linganisa I-Browns Ne-Greens</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="307.7">Beka ama-browns angamasentimitha angama-20 kuya</tspan><tspan x="96" y="368.7">kwangama-30 kuzo zonke i-greens ezingamasentimitha</tspan><tspan x="96" y="429.7">ama-5 kuya kwayi-10.</tspan></text><circle cx="108" cy="479.1" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="491.1">I-greens eningi yenza inqwaba ibe manzi, ishelele, futhi inuke</tspan><tspan x="150" y="543.1">i-ammonia.</tspan></text><circle cx="108" cy="584.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="596.2">Ama-browns amaningi agcina inqwaba ibanda izinyanga.</tspan></text><circle cx="108" cy="637.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="649.4">Ukulingana okufanele kunika inqwaba ukudla, umoya,</tspan><tspan x="150" y="701.4">nokushisa okwanele ukuze ibole.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="880" height="8" fill="#B07A1E"/></svg>
