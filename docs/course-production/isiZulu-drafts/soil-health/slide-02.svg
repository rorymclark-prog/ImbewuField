<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Kungani Lokhu Kubalulekile</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="247.9">Kungani Lokhu Kubalulekile</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="315.1">Ukutshala uhlobo olulodwa njalo, ukuklaba ngokweqile,</tspan><tspan x="96" y="376.1">noma ukushisa izinsalela zezitshalo kushiya umhlabathi</tspan><tspan x="96" y="437.1">uncike kumanyolo othengiwe ukuze ukhiqize noma yini.</tspan></text><circle cx="108" cy="486.5" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="498.4">Lapho impilo yomhlabathi isilahlekile, umhlabathi uba mhlophe,</tspan><tspan x="150" y="550.5">uqine, futhi kube nzima ukuwulima.</tspan></text><circle cx="108" cy="591.7" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="603.6">I-compost, i-mulch, ama-cover crops, nama-worm farms</tspan><tspan x="150" y="655.6">kungakha kabusha umhlabathi ophilayo emapulazini</tspan><tspan x="150" y="707.6">amancane aseNingizimu Afrika.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="160" height="8" fill="#E3B65C"/></svg>
