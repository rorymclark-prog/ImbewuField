<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Impilo Yomhlabathi Ne-Compost</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">1 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="273.4">Impilo Yomhlabathi Ne-Compost</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="342.3">Umhlabathi ungaphezu kokuba yindawo engaphansi</tspan><tspan x="96" y="404.8">kwezinyawo zakho.</tspan></text><circle cx="108" cy="455.4" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="467.6">Uyindawo ephilayo ondla izitshalo, ubambe amanzi, futhi</tspan><tspan x="150" y="520.9">uthwale isivuno sakho.</tspan></text><circle cx="108" cy="563.1" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="575.3">Kule module, uzofunda ukufunda umhlabathi, ukwenza</tspan><tspan x="150" y="628.6">i-compost ephephile, ukuvikela umhlabathi ongenalutho,</tspan><tspan x="150" y="681.9">nokusebenzisa ama-cover crops nama-worm farms.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="80" height="8" fill="#E3B65C"/></svg>
