<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Gcina Ama-Pod E-Wattle Ngaphandle</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="238">Gcina Ama-Pod E-Wattle</tspan><tspan x="96" y="318.8">Ngaphandle</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="386">Gcina ama-pod embewu ye-wattle ngaphandle</tspan><tspan x="96" y="447">kwenqwaba ye-compost.</tspan></text><circle cx="108" cy="496.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="508.4">Igobolondo lawo eliqinile lembewu lisinda ekushiseni</tspan><tspan x="150" y="560.4">okuvamile kwe-compost, bese lisabalalisa i-wattle</tspan><tspan x="150" y="612.4">nge-compost eqediwe.</tspan></text><circle cx="108" cy="653.6" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="665.5">Amagxolo e-wattle wodwa aphephile ukuwafaka, nakuba ebola</tspan><tspan x="150" y="717.6">kancane.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1040" height="8" fill="#B07A1E"/></svg>
