<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Vikela Umhlabathi Unyaka Wonke</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">18 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="264">Vikela Umhlabathi Unyaka</tspan><tspan x="96" y="344.8">Wonke</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="412">Insimu yase-Highveld eshiywe ingenalutho emva</tspan><tspan x="96" y="473">kokuvuna ummbila ibhekana nezingozi ezimbili ezinkulu.</tspan></text><circle cx="108" cy="522.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="534.4">Umoya wasebusika ungathwala umhlabathi ongaphezulu</tspan><tspan x="150" y="586.4">owomile.</tspan></text><circle cx="108" cy="627.6" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="639.5">Isiphepho sokuqala esinamandla sentwasahlobo sishaya</tspan><tspan x="150" y="691.5">umhlabathi ongenalutho futhi sonakalise isakhiwo sawo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2