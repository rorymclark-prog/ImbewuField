<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Imiphumela Yokufunda</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="81" fill="#F7F2E9"><tspan x="96" y="248.6">Imiphumela Yokufunda</tspan></text><text class="lead" font-size="55.2" fill="#F7F2E9"><tspan x="96" y="324">Ekupheleni kwalesi sifundo, uzokwazi ukuthi</tspan><tspan x="96" y="392.5">izinkukhu, amadada, izinyosi, ne-guinea fowl</tspan><tspan x="96" y="460.9">zingena kanjani ohlelweni olusebenzayo.</tspan></text><circle cx="108" cy="516.4" r="8.3" fill="#E3B65C"/><text class="point" font-size="47.8" fill="#CFC5AC"><tspan x="150" y="529.8">Uzokwazi ukuthi izinkukhu zisiza nini umbhede, nokuthi</tspan><tspan x="150" y="588.1">ukuklwebha kwazo kungadala nini umonakalo.</tspan></text><circle cx="108" cy="634.3" r="8.3" fill="#E3B65C"/><text class="point" font-size="47.8" fill="#CFC5AC"><tspan x="150" y="647.7">Uzoqonda ukuthuthwa kwempova, ukubekwa kwe-hive,</tspan><tspan x="150" y="706.1">nokubaluleka kokuvala imijikelezo yezakhamzimba.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="240" height="8" fill="#E3B65C"/></svg>
