<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Izinyosi Zenza Ihlathi Lokudla Likhiqize Kakhulu</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">10 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="262.4">Izinyosi Zenza Ihlathi Lokudla</tspan><tspan x="96" y="343.2">Likhiqize Kakhulu</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="410.4">Ku-avocado, izimbali zinezigaba zesifazane nezesilisa.</tspan><tspan x="96" y="471.4">Ukuqhakaza okuhambisanayo nokuhamba kwempova</tspan><tspan x="96" y="532.4">kungasekela ukubamba kwezithelo, kodwa isimo sezulu</tspan><tspan x="96" y="593.4">nempilo yomuthi nakho kubalulekile.</tspan></text><circle cx="108" cy="642.8" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="654.8">Bheka izimbali nezivakashi ngaphambi kokucabanga ukuthi</tspan><tspan x="150" y="706.8">isidleke sisodwa sizoxazulula ukubamba okuncane kwezithelo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="800" height="8" fill="#B07A1E"/></svg>
