<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Izinyosi Zomdabu ZaseNingizimu Afrika</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT · +</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="236.3">Izinyosi Zomdabu ZaseNingizimu</tspan><tspan x="96" y="317.2">Afrika</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="384.4">Thola usizo kumfuyi wezinyosi wendawo onolwazi</tspan><tspan x="96" y="445.4">ngaphambi kokugcina noma ukuhambisa izinyosi.</tspan><tspan x="96" y="506.4">Ungahambisi ama-colony phakathi kwezifunda ngenxa</tspan><tspan x="96" y="567.4">yalesi sifundo kuphela.</tspan></text><circle cx="108" cy="616.8" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="628.8">Impilo yezinyosi nokuphathwa okuphephile kudinga</tspan><tspan x="150" y="680.8">ukuqashelwa; i-colony yendabuko ayinazo ngokuzenzakalela</tspan><tspan x="150" y="732.8">izinambuzane noma izifo.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="880" height="8" fill="#B07A1E"/></svg>
