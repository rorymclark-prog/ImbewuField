<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Ama-Swale Abambezela Amanzi Emthambekeni</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">IMBEWUFIELD · isiZulu · DRAFT</text><text class="eye num" x="1504" y="88" fill="#8C7A62">3 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="272.7">Ama-Swale Abambezela</tspan><tspan x="96" y="363.4">Amanzi Emthambekeni</tspan></text><text class="lead" font-size="55.2" fill="#20190F"><tspan x="96" y="438.8">I-swale ingumsele oyisicaba ombiwa emgqeni</tspan><tspan x="96" y="507.3">wekhontolo — awutshekile, uyalingana</tspan><tspan x="96" y="575.7">ngokuphelele kusukela ekuqaleni kuye ekugcineni</tspan><tspan x="96" y="644.2">— ukuze amanzi awugcwalise ngokulingana futhi</tspan><tspan x="96" y="712.6">angene emhlabathini kunokuba ageleze ahambe.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="200" height="8" fill="#B07A1E"/></svg>
