<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Nitrogen-Fixing Trees</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="240.5">Nitrogen-Fixing Trees</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="307.7">Useful nitrogen-fixing trees include Senegalia, formerly</tspan><tspan x="96" y="368.7">Acacia, species and relatives like flat-crown, Albizia</tspan><tspan x="96" y="429.7">adianthifolia.</tspan></text><circle cx="108" cy="479.1" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="491.1">Tagasaste suits the Western Cape and highland zones.</tspan></text><circle cx="108" cy="532.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="544.2">It self-seeds readily, so plant it with care near untransformed land.</tspan></text><circle cx="108" cy="585.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="597.3">Sesbania sesban suits warm, moist KZN coastal and Lowveld</tspan><tspan x="150" y="649.4">conditions. Do not confuse it with Sesbania punicea, the</tspan><tspan x="150" y="701.4">red-flowered invasive relative.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="480" height="8" fill="#B07A1E"/></svg>
