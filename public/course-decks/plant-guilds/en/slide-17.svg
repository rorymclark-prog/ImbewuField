<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Fill the Guild’s Other Jobs</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">17 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="245.4">Fill the Guild’s Other Jobs</tspan></text><text class="lead" font-size="55.2" fill="#20190F"><tspan x="96" y="320.8">Place wild garlic in a ring at the outer edge for pest</tspan><tspan x="96" y="389.3">control.</tspan></text><circle cx="108" cy="444.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="458.1">Grow African basil between the comfrey, drawing in wasps</tspan><tspan x="150" y="516.4">that control fruit flies.</tspan></text><circle cx="108" cy="562.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="576.1">Let sweet potato carpet the ground.</tspan></text><circle cx="108" cy="622.3" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="635.7">Together, these plants give the mango guild pest control,</tspan><tspan x="150" y="694">beneficial insects, mulch, and food.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1360" height="8" fill="#B07A1E"/></svg>
