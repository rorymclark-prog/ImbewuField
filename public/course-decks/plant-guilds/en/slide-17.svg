<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Fill the Guild’s Other Jobs</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">17 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="247.9">Fill the Guild’s Other Jobs</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="315.1">Use wild garlic and African basil as flowering members</tspan><tspan x="96" y="376.1">where the site suits them. Watch which useful insects</tspan><tspan x="96" y="437.1">visit.</tspan></text><circle cx="108" cy="486.5" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="498.4">Sweet potato can cover ground and provide food, but its vines</tspan><tspan x="150" y="550.5">and roots also need space and water. Keep access to the</tspan><tspan x="150" y="602.5">mango clear.</tspan></text><circle cx="108" cy="643.7" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="655.6">Judge each plant by what it does in your garden; no</tspan><tspan x="150" y="707.6">companion plant guarantees control of fruit flies or other pests.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1360" height="8" fill="#B07A1E"/></svg>
