<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Learning Outcomes</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">PLANT SELECTION &amp; GUILDS</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="77.4" fill="#F7F2E9"><tspan x="96" y="255.6">Learning Outcomes</tspan></text><text class="lead" font-size="52.8" fill="#F7F2E9"><tspan x="96" y="327.8">By the end, you can explain how legumes fix</tspan><tspan x="96" y="393.2">atmospheric nitrogen through rhizobia in root nodules.</tspan></text><circle cx="108" cy="446.3" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="459.1">You can choose mulch plants and use chop and drop to return</tspan><tspan x="150" y="514.9">material to the soil surface.</tspan></text><circle cx="108" cy="559.1" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="571.9">You can plan flowering plants and wild garlic for biological</tspan><tspan x="150" y="627.7">pest management.</tspan></text><circle cx="108" cy="672" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="684.8">You can build a mango guild with each plant given a clear job.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="240" height="8" fill="#E3B65C"/></svg>
