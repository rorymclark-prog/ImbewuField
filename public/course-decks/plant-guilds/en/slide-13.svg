<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Wild Garlic in a Diverse Planting</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="246">Wild Garlic in a Diverse</tspan><tspan x="96" y="334.7">Planting</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="408.5">Wild garlic, Tulbaghia violacea, is a drought-tolerant</tspan><tspan x="96" y="475.4">flowering plant for suitable sites. Its leaves and</tspan><tspan x="96" y="542.4">flowers have food uses when correctly identified.</tspan></text><circle cx="108" cy="596.6" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="609.7">Use it as part of a diverse planting, and observe insect</tspan><tspan x="150" y="666.8">visits. Do not promise that a ring of wild garlic will repel</tspan><tspan x="150" y="723.9">aphids or whitefly or cure an existing infestation.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1040" height="8" fill="#B07A1E"/></svg>
