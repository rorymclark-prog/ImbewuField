<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Choose the Right Comfrey</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="84.5" fill="#1F4D2B"><tspan x="96" y="265.6">Choose the Right Comfrey</tspan></text><text class="lead" font-size="57.6" fill="#20190F"><tspan x="96" y="344.3">Comfrey is a classic mulch plant because of its</tspan><tspan x="96" y="415.7">deep roots.</tspan></text><circle cx="108" cy="473.6" r="8.6" fill="#B07A1E"/><text class="point" font-size="49.9" fill="#3A3020"><tspan x="150" y="487.5">Use Bocking 14 comfrey, Symphytum times uplandicum.</tspan></text><circle cx="108" cy="535.8" r="8.6" fill="#B07A1E"/><text class="point" font-size="49.9" fill="#3A3020"><tspan x="150" y="549.7">This cultivar is sterile and will not spread by seed.</tspan></text><circle cx="108" cy="598" r="8.6" fill="#B07A1E"/><text class="point" font-size="49.9" fill="#3A3020"><tspan x="150" y="611.9">Ordinary comfrey can set viable seed and spread beyond</tspan><tspan x="150" y="672.8">where you planted it, so the cultivar choice matters.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="880" height="8" fill="#B07A1E"/></svg>
