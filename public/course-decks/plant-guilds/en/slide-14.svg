<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>What Makes a Plant Guild</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="248.7">What Makes a Plant Guild</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="325.8">A plant guild is a group chosen to support a</tspan><tspan x="96" y="395.7">central tree, usually fruit or nut.</tspan></text><circle cx="108" cy="452.3" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="466">Members can produce food, fix nitrogen, supply mulch,</tspan><tspan x="150" y="525.7">support useful insects or cover the ground.</tspan></text><circle cx="108" cy="572.9" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="586.6">The plants still share light, water and space. Observe</tspan><tspan x="150" y="646.2">the guild, water during establishment and adjust plants</tspan><tspan x="150" y="705.8">that crowd the tree.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1120" height="8" fill="#B07A1E"/></svg>
