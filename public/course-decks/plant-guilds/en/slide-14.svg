<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>What Makes a Plant Guild</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="260.7">What Makes a Plant Guild</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="331.3">A plant guild is a group chosen to support one central</tspan><tspan x="96" y="395.2">tree, usually fruit or nut.</tspan></text><circle cx="108" cy="447" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="459.6">Each member has a job: fixing nitrogen, drawing up minerals,</tspan><tspan x="150" y="514.1">attracting beneficial insects, repelling pests, covering ground, or</tspan><tspan x="150" y="568.7">producing food.</tspan></text><circle cx="108" cy="611.9" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="624.4">The plants are selected as a community, not as separate crops.</tspan></text><circle cx="108" cy="667.6" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="680.1">Once established, a well-built guild needs little from you.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1120" height="8" fill="#B07A1E"/></svg>
