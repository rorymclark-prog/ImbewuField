<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Place and Cut the Sesbania</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="245.6">Place and Cut the Sesbania</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="319.4">For a mango guild in KZN's Lowveld or coast, place</tspan><tspan x="96" y="386.3">Sesbania sesban on the north-east and north-west</tspan><tspan x="96" y="453.3">sides.</tspan></text><circle cx="108" cy="507.5" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="520.6">Cut it back yearly for nitrogen and mulch.</tspan></text><circle cx="108" cy="565.8" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="578.9">Cutting stops it shading and competing with the mango.</tspan></text><circle cx="108" cy="624.1" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="637.2">Plant Bocking 14 comfrey 60 to 80cm from the trunk in four</tspan><tspan x="150" y="694.3">spots, then chop and drop it regularly.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1280" height="8" fill="#B07A1E"/></svg>
