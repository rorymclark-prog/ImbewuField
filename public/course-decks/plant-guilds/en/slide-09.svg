<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Mulch Plants and Chop and Drop</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">9 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="255.4">Mulch Plants and Chop and Drop</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="329.2">Some plants grow deep, wide-ranging roots.</tspan></text><circle cx="108" cy="383.4" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="396.5">Those roots can draw up minerals that other crops cannot</tspan><tspan x="150" y="453.6">reach.</tspan></text><circle cx="108" cy="498.9" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="512">When you cut the plant and leave it on the ground, chop and</tspan><tspan x="150" y="569.1">drop returns that material to the surface.</tspan></text><circle cx="108" cy="614.3" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="627.4">This helps hold moisture, suppress weeds, and build steady</tspan><tspan x="150" y="684.5">organic matter, even when the exact fertility gain is debated.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="720" height="8" fill="#B07A1E"/></svg>
