<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Assignment</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">PLANT SELECTION &amp; GUILDS</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">19 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="77.4" fill="#F7F2E9"><tspan x="96" y="255.6">Field Assignment</tspan></text><text class="lead" font-size="52.8" fill="#F7F2E9"><tspan x="96" y="327.8">Walk a growing area on your land and choose a</tspan><tspan x="96" y="393.2">central fruit tree.</tspan></text><circle cx="108" cy="446.3" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="459.1">Write down the jobs your guild still needs: soil feeding,</tspan><tspan x="150" y="514.9">mulch, pest control, beneficial insects, ground cover, or</tspan><tspan x="150" y="570.7">food.</tspan></text><circle cx="108" cy="614.9" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="627.7">Mark where existing plants already do a job.</tspan></text><circle cx="108" cy="672" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="684.8">Then sketch a guild using only plants named in this lesson.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1520" height="8" fill="#E3B65C"/></svg>
