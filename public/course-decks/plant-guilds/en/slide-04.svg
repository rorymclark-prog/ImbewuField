<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>How Legumes Feed the Soil</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">4 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="252">How Legumes Feed the Soil</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="329.1">Legumes partner with soil bacteria called rhizobia</tspan><tspan x="96" y="399">in root nodules. The bacteria convert nitrogen</tspan><tspan x="96" y="469">from the air into forms the legume can use.</tspan></text><circle cx="108" cy="525.6" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="539.3">Nitrogen in cut leaves and dead roots returns to the</tspan><tspan x="150" y="598.9">soil as organisms decompose that material. Cutting</tspan><tspan x="150" y="658.5">does not make all of it immediately available to</tspan><tspan x="150" y="718.2">neighbouring crops.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="320" height="8" fill="#B07A1E"/></svg>
