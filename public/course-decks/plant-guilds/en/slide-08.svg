<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Where to Place Nitrogen Fixers</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="245.4">Where to Place Nitrogen Fixers</tspan></text><text class="lead" font-size="55.2" fill="#20190F"><tspan x="96" y="320.8">Place nitrogen fixers uphill or upwind of fruit trees, so</tspan><tspan x="96" y="389.3">fertility moves downhill towards the fruit trees.</tspan></text><circle cx="108" cy="444.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="458.1">In a food forest, plant nitrogen fixers at twice fruit-tree</tspan><tspan x="150" y="516.4">density early on.</tspan></text><circle cx="108" cy="562.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="576.1">As the canopy closes, thin the nitrogen fixers.</tspan></text><circle cx="108" cy="622.3" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="635.7">For a degraded field in a warm, moist KZN summer,</tspan><tspan x="150" y="694">Sesbania sesban is the practical fast annual choice.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="640" height="8" fill="#B07A1E"/></svg>
