<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">PLANT SELECTION &amp; GUILDS</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="84.5" fill="#F7F2E9"><tspan x="96" y="249">Field Action</tspan></text><text class="lead" font-size="57.6" fill="#F7F2E9"><tspan x="96" y="327.7">Plant or plan one guild around a central tree.</tspan></text><circle cx="108" cy="385.6" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="399.6">Choose Sesbania sesban for nitrogen where warm,</tspan><tspan x="150" y="460.5">moist KZN conditions suit it, Bocking 14 comfrey for chop</tspan><tspan x="150" y="521.4">and drop, wild garlic and African basil for pest</tspan><tspan x="150" y="582.3">management, and sweet potato for ground cover.</tspan></text><circle cx="108" cy="630.5" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="644.5">Give each plant a job, then watch how the community</tspan><tspan x="150" y="705.4">changes as it grows.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
