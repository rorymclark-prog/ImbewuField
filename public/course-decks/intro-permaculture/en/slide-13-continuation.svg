<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Watch: Diversity Against One Bad Day</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2 · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="260.2">Watch: Diversity Against One</tspan><tspan x="96" y="352.8">Bad Day</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="429.9">Two others worth knowing: produce no waste, so</tspan><tspan x="96" y="499.8">scraps become compost and compost becomes</tspan><tspan x="96" y="569.8">soil. And use small and slow solutions — a</tspan><tspan x="96" y="639.7">bucket can irrigate a bed with no electricity at all.</tspan></text><circle cx="108" cy="696.3" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="710">What would one bad day cost you right now?</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="945.5" height="8" fill="#B07A1E"/></svg>
