<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Learning Outcomes</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">INTRODUCTION TO PERMACULTURE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 22</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="252.5">Learning Outcomes</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="319.7">By the end of this module you will be able to do three things.</tspan></text><circle cx="108" cy="369.1" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="381.1">Name the three ethics, and use them to settle a decision that has</tspan><tspan x="150" y="433.1">no obvious answer.</tspan></text><circle cx="108" cy="474.3" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="486.2">Name the design principles that matter most on your land, and say</tspan><tspan x="150" y="538.3">why.</tspan></text><circle cx="108" cy="579.5" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="591.4">Sketch your zones and your sectors on one sheet of paper.</tspan></text><rect x="96" y="710" width="1408" height="2" fill="rgba(247,242,233,0.22)"/><text class="q" fill="#E3B65C"><tspan x="96" y="781.9">That sketch is the skeleton of every plan you make after this.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="218.2" height="8" fill="#E3B65C"/></svg>
