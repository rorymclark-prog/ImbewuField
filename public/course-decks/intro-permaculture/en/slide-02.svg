<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Why This Matters</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">INTRODUCTION TO PERMACULTURE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 22</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="253.4">Why This Matters</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="322.2">A good design saves work before you pick up a spade.</tspan></text><circle cx="108" cy="372.8" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="385.1">Most of the effort on a smallholding is not planting or harvesting.</tspan><tspan x="150" y="438.4">It is walking, carrying and fixing what was put in the wrong place.</tspan></text><circle cx="108" cy="480.6" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="492.8">Permaculture is a way of deciding where things go, so the land</tspan><tspan x="150" y="546.1">works with you instead of against you.</tspan></text><rect x="96" y="652.1" width="1408" height="2" fill="rgba(247,242,233,0.22)"/><text class="q" fill="#E3B65C"><tspan x="96" y="724">Think of one job on your farm that takes longer than it should.</tspan><tspan x="96" y="782">Where does the time actually go?</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="145.5" height="8" fill="#E3B65C"/></svg>
