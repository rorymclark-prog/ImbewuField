<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Fair Share</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="248.1">Fair Share</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="317">The third ethic is Fair Share.</tspan></text><circle cx="108" cy="367.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="379.8">Take only what you need, and return the surplus to the system —</tspan><tspan x="150" y="433.1">seeds, food, water, knowledge.</tspan></text><circle cx="108" cy="475.3" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="487.6">A farmer who sells all his surplus mielies and keeps nothing back</tspan><tspan x="150" y="540.9">for compost or for seed is breaking this one. Nothing goes back.</tspan></text><circle cx="108" cy="583.1" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="595.3">A community that fences off a shared spring is breaking it too.</tspan></text><rect x="96" y="710" width="1408" height="2" fill="#E2D8C4"/><text class="q" fill="#8A4B2A"><tspan x="96" y="781.9">What does your land get back from you each season?</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="436.4" height="8" fill="#B07A1E"/></svg>
