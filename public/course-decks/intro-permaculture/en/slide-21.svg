<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Assignment</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">INTRODUCTION TO PERMACULTURE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">21 / 22</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="81" fill="#F7F2E9"><tspan x="96" y="245.4">Field Assignment</tspan></text><text class="lead" font-size="55.2" fill="#F7F2E9"><tspan x="96" y="320.8">Sketch your own zones and sectors on one sheet of</tspan><tspan x="96" y="389.3">paper.</tspan></text><circle cx="108" cy="444.7" r="8.3" fill="#E3B65C"/><text class="point" font-size="47.8" fill="#CFC5AC"><tspan x="150" y="458.1">Mark Zone 0 and Zone 1 first, then work outward as far as</tspan><tspan x="150" y="516.4">your land goes.</tspan></text><circle cx="108" cy="562.7" r="8.3" fill="#E3B65C"/><text class="point" font-size="47.8" fill="#CFC5AC"><tspan x="150" y="576.1">Add an arrow for each energy that arrives from outside, and</tspan><tspan x="150" y="634.4">label where it comes from.</tspan></text><circle cx="108" cy="680.6" r="8.3" fill="#E3B65C"/><text class="point" font-size="47.8" fill="#CFC5AC"><tspan x="150" y="694">Photograph the sketch.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1527.3" height="8" fill="#E3B65C"/></svg>
