<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Watch: Diversity Against One Bad Day</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="238">Watch: Diversity Against One Bad</tspan><tspan x="96" y="318.8">Day</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="386">A monoculture maize field can be wiped out by one</tspan><tspan x="96" y="447">hailstorm. A mixed planting rarely is.</tspan></text><circle cx="108" cy="496.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="508.4">That is the principle &quot;use and value diversity&quot;, and it is insurance</tspan><tspan x="150" y="560.4">you plant rather than buy.</tspan></text><circle cx="108" cy="601.6" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="613.5">Two others worth knowing: produce no waste, so scraps become</tspan><tspan x="150" y="665.5">compost and compost becomes soil. And use small and slow</tspan><tspan x="150" y="717.6">solutions — a bucket can irrigate a bed with no electricity at all.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="945.5" height="8" fill="#B07A1E"/></svg>
