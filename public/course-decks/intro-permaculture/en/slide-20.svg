<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Sketch It And You Have A Design</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">20 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="242.5">Sketch It And You Have A Design</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="314.6">Draw your boundary. Mark the house. Draw the rings</tspan><tspan x="96" y="380.1">outward by how often you visit.</tspan></text><circle cx="108" cy="433.1" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="445.9">Then draw arrows in from outside for sun, wind, fire and</tspan><tspan x="150" y="501.8">water.</tspan></text><circle cx="108" cy="546" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="558.8">That sheet of paper is the skeleton of your design. Everything</tspan><tspan x="150" y="614.6">else in this course hangs on it.</tspan></text><rect x="96" y="710" width="1408" height="2" fill="#E2D8C4"/><text class="q" fill="#8A4B2A"><tspan x="96" y="781.9">It does not need to be neat. It needs to be true.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1454.5" height="8" fill="#B07A1E"/></svg>
