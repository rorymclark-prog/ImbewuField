<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Watch: One Decision, Three Ethics</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">7 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="263.5">Watch: One Decision, Three Ethics</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="335.7">A borehole is producing more water than your</tspan><tspan x="96" y="401.2">household needs.</tspan></text><circle cx="108" cy="454.2" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="467">You could keep it closed. You could open it to everyone and</tspan><tspan x="150" y="522.8">watch the level drop.</tspan></text><circle cx="108" cy="567" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="579.8">Sharing access with your neighbours while you monitor the</tspan><tspan x="150" y="635.7">water table serves all three at once. People Care and Fair</tspan><tspan x="150" y="691.5">Share in the sharing. Earth Care in the monitoring.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="509.1" height="8" fill="#B07A1E"/></svg>
