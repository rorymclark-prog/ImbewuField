<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Integrate Rather Than Segregate</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="249.5">Integrate Rather Than Segregate</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="316.7">Put each element where it works for its neighbours.</tspan></text><circle cx="108" cy="366.1" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="378">A garden, fruit trees and a chicken run arranged so the</tspan><tspan x="150" y="430.1">chickens rotate through the beds after harvest is integration.</tspan><tspan x="150" y="482.1">The chickens clean up pests and add fertility instead of sitting</tspan><tspan x="150" y="534.1">idle in a fixed pen.</tspan></text><circle cx="108" cy="575.3" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="587.2">The same three things, fenced apart, do only their own job.</tspan></text><circle cx="108" cy="628.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="640.4">Pick two or three principles that speak to your biggest problem</tspan><tspan x="150" y="692.4">and apply them hard. The rest become obvious as you go.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1018.2" height="8" fill="#B07A1E"/></svg>
