<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Why Zone 1 Is Not Negotiable</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="86.2" fill="#1F4D2B"><tspan x="96" y="275.3">Why Zone 1 Is Not Negotiable</tspan></text><text class="lead" font-size="58.8" fill="#20190F"><tspan x="96" y="355.6">Herbs need daily picking to stay productive.</tspan></text><circle cx="108" cy="414.7" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="428.9">Plant them in Zone 3, out in the main field, and the walk</tspan><tspan x="150" y="491.1">is long enough that the daily visit stops happening. The</tspan><tspan x="150" y="553.3">herbs bolt, or they are simply neglected.</tspan></text><circle cx="108" cy="602.5" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="616.8">Nothing is wrong with the plant or the soil. The plant</tspan><tspan x="150" y="679">was put where your feet do not go.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1163.6" height="8" fill="#B07A1E"/></svg>
