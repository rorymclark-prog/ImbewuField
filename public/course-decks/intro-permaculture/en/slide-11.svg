<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Catch and Store Energy</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="239.2">Catch and Store Energy</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="308.1">Harvest rain, sun and biomass before they leave your</tspan><tspan x="96" y="370.6">property.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="433.4">Every one of those arrives free and leaves free. Water runs</tspan><tspan x="150" y="486.7">off, leaves blow away, sun falls on bare ground.</tspan></text><circle cx="108" cy="528.9" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="541.1">Catching them is almost always cheaper than buying the</tspan><tspan x="150" y="594.4">same thing later.</tspan></text><circle cx="108" cy="636.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="648.9">Name one thing that arrives on your land free and leaves</tspan><tspan x="150" y="702.2">again without being used.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="800" height="8" fill="#B07A1E"/></svg>
