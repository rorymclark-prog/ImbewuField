<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Twelve Principles</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">9 / 22</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="245.4">Twelve Principles</tspan></text><text class="lead" font-size="55.2" fill="#20190F"><tspan x="96" y="320.8">David Holmgren set out twelve design principles</tspan><tspan x="96" y="389.3">for permaculture.</tspan></text><circle cx="108" cy="444.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="458.1">You do not need all twelve to start. We will begin with</tspan><tspan x="150" y="516.4">three useful ways to look at your smallholding.</tspan></text><circle cx="108" cy="562.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="576.1">Observe and interact. Catch and store energy. Use</tspan><tspan x="150" y="634.4">edges and value the marginal.</tspan></text><circle cx="108" cy="680.6" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="694">We will take those three one at a time.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="654.5" height="8" fill="#B07A1E"/></svg>
