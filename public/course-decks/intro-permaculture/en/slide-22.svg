<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">INTRODUCTION TO PERMACULTURE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">22 / 22</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="79.2" fill="#F7F2E9"><tspan x="96" y="255.4">Field Action</tspan></text><text class="lead" font-size="54" fill="#F7F2E9"><tspan x="96" y="329.2">Walk out and check your sketch against the ground.</tspan></text><circle cx="108" cy="383.4" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="396.5">Stand at the kitchen door and count what is really in Zone 1</tspan><tspan x="150" y="453.6">today.</tspan></text><circle cx="108" cy="498.9" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="512">Find one thing planted further away than how often you use</tspan><tspan x="150" y="569.1">it, and write down where it should move to.</tspan></text><circle cx="108" cy="614.3" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="627.4">Then ask one older neighbour which direction the worst wind</tspan><tspan x="150" y="684.5">comes from, and compare their answer with your arrow.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
