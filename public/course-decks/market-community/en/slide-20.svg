<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action: Use the Record</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">MARKET GARDENING &amp; COMMUNITY</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="75.7" fill="#F7F2E9"><tspan x="96" y="238.2">Field Action: Use the Record</tspan></text><text class="lead" font-size="51.6" fill="#F7F2E9"><tspan x="96" y="308.7">Choose one real selling decision from your farm.</tspan></text><circle cx="108" cy="360.5" r="7.7" fill="#E3B65C"/><text class="point" font-size="44.7" fill="#CFC5AC"><tspan x="150" y="373">If a product costs more to produce than its selling price,</tspan><tspan x="150" y="427.6">raise the price, cut input costs, or shift labour to a better</tspan><tspan x="150" y="482.1">crop.</tspan></text><circle cx="108" cy="525.3" r="7.7" fill="#E3B65C"/><text class="point" font-size="44.7" fill="#CFC5AC"><tspan x="150" y="537.9">If a food gap appears in June and July, plan cold-tolerant</tspan><tspan x="150" y="592.4">winter crops in March-April.</tspan></text><circle cx="108" cy="635.6" r="7.7" fill="#E3B65C"/><text class="point" font-size="44.7" fill="#CFC5AC"><tspan x="150" y="648.1">Then talk with neighbours about one local sale, seed swap,</tspan><tspan x="150" y="702.7">tool share, or skills swap.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
