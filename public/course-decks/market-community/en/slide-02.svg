<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Why This Matters</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">MARKET GARDENING &amp; COMMUNITY</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="239.2">Why This Matters</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="308.1">Most smallholders undersell what their farms produce</tspan><tspan x="96" y="370.6">because they do not write it down.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="433.4">A tomato, an egg, or a bundle of morogo can go to the family, a</tspan><tspan x="150" y="486.7">customer, a neighbour, or compost.</tspan></text><circle cx="108" cy="528.9" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="541.1">When you record each one, you can see what your land and</tspan><tspan x="150" y="594.4">labour are really doing.</tspan></text><circle cx="108" cy="636.6" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="648.9">That clear picture helps you protect household food and make</tspan><tspan x="150" y="702.2">better business choices.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="160" height="8" fill="#E3B65C"/></svg>
