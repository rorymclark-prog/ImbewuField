<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Why This Matters</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">MARKET GARDENING &amp; COMMUNITY</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="82.7" fill="#F7F2E9"><tspan x="96" y="248.7">Why This Matters</tspan></text><text class="lead" font-size="56.4" fill="#F7F2E9"><tspan x="96" y="325.8">Without records, it is easy to miss what your farm</tspan><tspan x="96" y="395.7">produces and what it costs.</tspan></text><circle cx="108" cy="452.3" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="466">A tomato, an egg, or a bundle of morogo can go to the</tspan><tspan x="150" y="525.7">family, a customer, a neighbour, or compost.</tspan></text><circle cx="108" cy="572.9" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="586.6">Record where the harvest goes. This helps you protect</tspan><tspan x="150" y="646.2">household food and compare business choices using</tspan><tspan x="150" y="705.8">your own evidence.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="160" height="8" fill="#E3B65C"/></svg>
