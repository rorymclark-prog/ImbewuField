<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Sell Locally to Reduce Loss</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">17 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="252.4">Sell Locally to Reduce Loss</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="319.6">Record how much produce is damaged, unsold or lost</tspan><tspan x="96" y="380.6">between harvest and sale, and where the loss happens.</tspan></text><circle cx="108" cy="430" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="441.9">Nearby buyers can reduce travel and delay. They do not</tspan><tspan x="150" y="494">remove the need for careful handling, clean containers,</tspan><tspan x="150" y="546">suitable storage and timely delivery.</tspan></text><circle cx="108" cy="587.2" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="599.1">Compare the income left after transport, packaging, fees,</tspan><tspan x="150" y="651.1">labour and losses for each route. Use actual local prices and</tspan><tspan x="150" y="703.2">costs; a shorter journey does not guarantee a higher return.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1360" height="8" fill="#B07A1E"/></svg>
