<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Plan Around Box Customers</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="246.8">Plan Around Box Customers</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="315.7">Before offering vegetable boxes, list what you can</tspan><tspan x="96" y="378.2">supply each week after keeping food for the household.</tspan></text><circle cx="108" cy="428.8" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="441">Compare that supply with the number and size of boxes</tspan><tspan x="150" y="494.3">customers want. Check labour, water, packing, delivery and</tspan><tspan x="150" y="547.6">payment arrangements.</tspan></text><circle cx="108" cy="589.8" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="602">Start with a commitment you can meet. Garden area and</tspan><tspan x="150" y="655.3">customer count alone cannot promise an income. Agree how</tspan><tspan x="150" y="708.6">you will handle a short harvest or a cancelled order.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="960" height="8" fill="#B07A1E"/></svg>
