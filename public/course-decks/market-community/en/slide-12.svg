<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Plan Around Box Customers</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="86.2" fill="#1F4D2B"><tspan x="96" y="266.5">Plan Around Box Customers</tspan></text><text class="lead" font-size="58.8" fill="#20190F"><tspan x="96" y="346.8">A box scheme can suit a garden of 200 to 500m².</tspan></text><circle cx="108" cy="405.9" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="420.1">Ten regular box customers can provide meaningful</tspan><tspan x="150" y="482.3">monthly income.</tspan></text><circle cx="108" cy="531.5" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="545.8">The important value is not only the price per kilogram.</tspan></text><circle cx="108" cy="595" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="609.3">You know in advance what customers expect, so you</tspan><tspan x="150" y="671.5">grow for real demand instead of growing speculatively.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="960" height="8" fill="#B07A1E"/></svg>
