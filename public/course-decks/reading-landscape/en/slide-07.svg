<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Slow It High, Sink It Mid, Control It Low</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">7 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="263.3">Slow It High, Sink It Mid, Control It</tspan><tspan x="96" y="346.1">Low</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="414.9">Water picks up speed and erosive force as it runs downhill.</tspan></text><circle cx="108" cy="465.5" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="477.8">Slow it as high on the slope as possible. Sink it in the middle of</tspan><tspan x="150" y="531.1">the slope. Control it at the bottom.</tspan></text><circle cx="108" cy="573.3" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="585.5">This keeps more moisture in the land and prevents damage</tspan><tspan x="150" y="638.8">lower down. The higher you slow water, the earlier you stop</tspan><tspan x="150" y="692.1">erosion from growing.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="533.3" height="8" fill="#B07A1E"/></svg>
