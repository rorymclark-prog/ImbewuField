<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Reading the Landscape</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · HOME-STUDY MODULE · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">1 / 21</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="88" fill="#F7F2E9"><tspan x="96" y="269.1">Reading the Landscape</tspan></text><text class="lead" font-size="60" fill="#F7F2E9"><tspan x="96" y="351.1">Read the land before you change it. Find</tspan><tspan x="96" y="425.5">where water moves, where sunlight falls,</tspan><tspan x="96" y="499.9">where wind travels, and where cold air settles.</tspan></text><circle cx="108" cy="560.2" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="574.7">These observations guide practical choices for</tspan><tspan x="150" y="638.2">crops, trees, buildings, roads, and water. They are</tspan><tspan x="150" y="701.6">the start of good design.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="76.2" height="8" fill="#E3B65C"/></svg>
