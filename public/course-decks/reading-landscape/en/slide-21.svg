<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">READING THE LANDSCAPE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">21 / 21</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="75.7" fill="#F7F2E9"><tspan x="96" y="241.2">Field Action</tspan></text><text class="lead" font-size="51.6" fill="#F7F2E9"><tspan x="96" y="311.7">Build an A-frame level from three poles and a weighted</tspan><tspan x="96" y="375.7">string.</tspan></text><circle cx="108" cy="427.5" r="7.7" fill="#E3B65C"/><text class="point" font-size="44.7" fill="#CFC5AC"><tspan x="150" y="440">Use it to trace contour lines across your land. Mark where you</tspan><tspan x="150" y="494.6">would slow water high, sink it mid-slope, and control it at the</tspan><tspan x="150" y="549.1">bottom.</tspan></text><circle cx="108" cy="592.4" r="7.7" fill="#E3B65C"/><text class="point" font-size="44.7" fill="#CFC5AC"><tspan x="150" y="604.9">Add summer and winter wind arrows, shade observations from</tspan><tspan x="150" y="659.4">8am, midday, and 4pm, and your zones and sectors. Keep the</tspan><tspan x="150" y="714">map and update it.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
