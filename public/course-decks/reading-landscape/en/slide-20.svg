<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Assignment</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">READING THE LANDSCAPE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 21</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="82.7" fill="#F7F2E9"><tspan x="96" y="246.9">Field Assignment</tspan></text><text class="lead" font-size="56.4" fill="#F7F2E9"><tspan x="96" y="323.9">Walk after a storm when the site is safe. Mark</tspan><tspan x="96" y="393.9">rills, spreading water, ponds and routes where</tspan><tspan x="96" y="463.8">excess water leaves. Stay away from lightning,</tspan><tspan x="96" y="533.8">fast water and unstable banks.</tspan></text><circle cx="108" cy="590.4" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="604.1">Return safely at dawn in your local frost season. Look</tspan><tspan x="150" y="663.7">for ice crystals and note where frost remains longest.</tspan><tspan x="150" y="723.3">Do not use mist alone as proof.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1523.8" height="8" fill="#E3B65C"/></svg>
