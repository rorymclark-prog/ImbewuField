<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Let Plants Help You Read Soil</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 4</text><text class="eye num" x="1504" y="88" fill="#8C7A62">18 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="268.5">Let Plants Help You Read Soil</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="339">Look for places where frost sits longest and where the</tspan><tspan x="96" y="403">ground smells damp during dry months.</tspan></text><circle cx="108" cy="454.8" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="467.3">Notice existing vegetation. Thick khakibos or blackjack growing</tspan><tspan x="150" y="521.9">in one corner often signals disturbed or compacted soil.</tspan></text><circle cx="108" cy="565.1" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="577.6">These are pioneer weeds. They colonise ground that has been</tspan><tspan x="150" y="632.2">disturbed or compacted. Mark the area on your map so your</tspan><tspan x="150" y="686.7">future design responds to the soil condition.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1371.4" height="8" fill="#B07A1E"/></svg>
