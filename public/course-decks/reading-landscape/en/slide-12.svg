<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Lesson 3: Read Wind, Frost, and Slope</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="238">Lesson 3: Read Wind, Frost, and</tspan><tspan x="96" y="318.8">Slope</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="386">Wind can damage a smallholding even when it is hard to</tspan><tspan x="96" y="447">see.</tspan></text><circle cx="108" cy="496.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="508.4">Highveld farms face hot, dry north-westerlies in August and</tspan><tspan x="150" y="560.4">September. KZN escarpment farms face cold south-westerly fronts</tspan><tspan x="150" y="612.4">in winter and humid easterlies in summer.</tspan></text><circle cx="108" cy="653.6" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="665.5">Know your region's pattern before planting. Wind direction affects</tspan><tspan x="150" y="717.6">windbreaks, crop protection, drying, and disease.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="914.3" height="8" fill="#B07A1E"/></svg>
