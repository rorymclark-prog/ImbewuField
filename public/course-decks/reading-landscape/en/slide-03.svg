<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Learning Outcomes</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">READING THE LANDSCAPE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 21</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="79.2" fill="#F7F2E9"><tspan x="96" y="250.5">Learning Outcomes</tspan></text><text class="lead" font-size="54" fill="#F7F2E9"><tspan x="96" y="324.3">By the end of this module, you will be able to follow</tspan><tspan x="96" y="391.3">water across your land and find where it leaves.</tspan></text><circle cx="108" cy="445.5" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="458.6">You will read sun angles, shade, wind, frost, and slope.</tspan></text><circle cx="108" cy="503.8" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="516.9">You will use an A-frame level to trace contours.</tspan></text><circle cx="108" cy="562.1" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="575.2">You will draw a simple site map with water flow, seasonal</tspan><tspan x="150" y="632.3">winds, frost pockets, existing vegetation, zones, and</tspan><tspan x="150" y="689.4">sectors.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="228.6" height="8" fill="#E3B65C"/></svg>
