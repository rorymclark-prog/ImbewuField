<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Trace Contours with an A-Frame</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="248.7">Trace Contours with an A-Frame</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="325.8">Build an A-frame level from three poles and a</tspan><tspan x="96" y="395.7">weighted string.</tspan></text><circle cx="108" cy="452.3" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="466">Walk it across the land to find points at the same height.</tspan><tspan x="150" y="525.7">Join these points to trace a contour line.</tspan></text><circle cx="108" cy="572.9" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="586.6">Two people can trace contour lines across a two-hectare</tspan><tspan x="150" y="646.2">property in a morning. No surveyor is needed. This simple</tspan><tspan x="150" y="705.8">tool is practical for placing swales, dams, and tree rows.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="457.1" height="8" fill="#B07A1E"/></svg>
