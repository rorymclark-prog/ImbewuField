<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Trace Contours with an A-Frame</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1 · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="271.8">Trace Contours with an A-Frame</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="340.7">Keep one foot fixed. Move the other across the slope</tspan><tspan x="96" y="403.1">until the settled string meets the level mark. Peg that</tspan><tspan x="96" y="465.6">foot position, pivot onto it, and repeat to trace a</tspan><tspan x="96" y="528.1">contour.</tspan></text><circle cx="108" cy="578.7" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="591">Recheck calibration if the frame shifts. This marks level</tspan><tspan x="150" y="644.3">points; it does not design a dam or prove an earthwork is</tspan><tspan x="150" y="697.6">safe. Get suitable technical advice before digging.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="457.1" height="8" fill="#B07A1E"/></svg>
