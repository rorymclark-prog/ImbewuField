<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Choose Airflow and Warmth</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">15 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="242.2">Choose Airflow and Warmth</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="311.1">For a frost-sensitive nursery, look for a sheltered,</tspan><tspan x="96" y="373.5">gently sloping position above the places where cold air</tspan><tspan x="96" y="436">collects. A north-facing aspect can add winter warmth.</tspan></text><circle cx="108" cy="486.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="498.9">For tomatoes troubled by late blight, choose a site with good</tspan><tspan x="150" y="552.2">airflow and morning sun to help leaves dry.</tspan></text><circle cx="108" cy="594.4" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="606.6">This can reduce the time leaves stay wet. It does not cure</tspan><tspan x="150" y="659.9">late blight or replace disease identification and suitable</tspan><tspan x="150" y="713.2">management advice.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1142.9" height="8" fill="#B07A1E"/></svg>
