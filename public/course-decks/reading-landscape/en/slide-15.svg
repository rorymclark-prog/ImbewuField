<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Choose Airflow and Warmth</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">15 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="242.2">Choose Airflow and Warmth</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="311.1">Put your most frost-sensitive seedling nursery on a</tspan><tspan x="96" y="373.5">gently sloping, north-facing hillside above the frost-pool</tspan><tspan x="96" y="436">zone.</tspan></text><circle cx="108" cy="486.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="498.9">For tomatoes troubled by late blight, move the bed</tspan><tspan x="150" y="552.2">somewhere with good airflow and morning sun. Morning sun</tspan><tspan x="150" y="605.5">dries leaves quickly.</tspan></text><circle cx="108" cy="647.7" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="659.9">Air movement and dry leaves make it harder for fungal</tspan><tspan x="150" y="713.2">disease to keep the damp conditions it needs.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1142.9" height="8" fill="#B07A1E"/></svg>
