<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Protect Frost-Tender Plants</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="241.2">Protect Frost-Tender Plants</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="311.7">For frost-sensitive plants such as pawpaw and young</tspan><tspan x="96" y="375.7">citrus, use the warmth of a north-facing wall.</tspan></text><circle cx="108" cy="427.5" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="440">The wall absorbs heat during the day and releases it at night.</tspan><tspan x="150" y="494.6">That night-time warmth can protect a tender plant when frost</tspan><tspan x="150" y="549.1">arrives.</tspan></text><circle cx="108" cy="592.4" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="604.9">Do not place vulnerable crops in a cold, south-facing hollow.</tspan><tspan x="150" y="659.4">Choose a position that receives warmth and avoids trapped</tspan><tspan x="150" y="714">frost.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="838.1" height="8" fill="#B07A1E"/></svg>
