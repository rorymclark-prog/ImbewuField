<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Protect Frost-Tender Plants</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="86.2" fill="#1F4D2B"><tspan x="96" y="273.4">Protect Frost-Tender Plants</tspan></text><text class="lead" font-size="58.8" fill="#20190F"><tspan x="96" y="353.7">A sun-warmed north-facing wall can offer a</tspan><tspan x="96" y="426.6">warmer position for frost-sensitive plants such</tspan><tspan x="96" y="499.5">as pawpaw and young citrus.</tspan></text><circle cx="108" cy="558.6" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="572.8">A wall can store daytime warmth and release it at</tspan><tspan x="150" y="635">night. This can help, but it does not guarantee</tspan><tspan x="150" y="697.2">protection from a severe frost.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="838.1" height="8" fill="#B07A1E"/></svg>
