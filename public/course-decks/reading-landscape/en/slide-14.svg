<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Frost Flows Downhill</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="248.7">Frost Flows Downhill</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="325.8">Frost behaves like water. At night, cold air flows</tspan><tspan x="96" y="395.7">downhill and pools in low ground.</tspan></text><circle cx="108" cy="452.3" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="466">A valley bottom frosts weeks before and after the slopes</tspan><tspan x="150" y="525.7">above it. A gap in a ridgeline can funnel cold air two or</tspan><tspan x="150" y="585.3">three hundred metres into a sheltered valley.</tspan></text><circle cx="108" cy="632.5" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="646.2">Walk the land at dawn on a cold June morning. Mist and</tspan><tspan x="150" y="705.8">frozen dew show where frost lingers.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1066.7" height="8" fill="#B07A1E"/></svg>
