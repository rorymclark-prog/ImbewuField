<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Check Winter Shadows Before Building</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">10 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="242.8">Check Winter Shadows Before</tspan><tspan x="96" y="331.5">Building</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="405.3">Winter sun sits lower and further north than summer</tspan><tspan x="96" y="472.3">sun.</tspan></text><circle cx="108" cy="526.5" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="539.6">A wall that casts no shade in summer can shade a bed for</tspan><tspan x="150" y="596.7">hours in winter. A 2m shade cloth on the north side of a</tspan><tspan x="150" y="653.8">garden can block low winter sun for most of the day.</tspan></text><circle cx="108" cy="699" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="712.1">Check the spot at 8am, midday, and 4pm on a winter's day.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="761.9" height="8" fill="#B07A1E"/></svg>
