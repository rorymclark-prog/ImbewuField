<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Lesson 2: Read Sun and Shade</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="252.9">Lesson 2: Read Sun and</tspan><tspan x="96" y="339.6">Shade</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="411.8">In South Africa, winter midday sun is to the north.</tspan></text><circle cx="108" cy="464.8" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="477.6">North-facing slopes tend to receive more winter sun and</tspan><tspan x="150" y="533.4">warmth than south-facing slopes. Actual moisture and frost</tspan><tspan x="150" y="589.3">also depend on shade, soil and where cold air settles.</tspan></text><circle cx="108" cy="633.5" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="646.3">Observe your own site across the seasons before</tspan><tspan x="150" y="702.1">choosing positions for tender crops, trees and buildings.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="609.5" height="8" fill="#B07A1E"/></svg>
