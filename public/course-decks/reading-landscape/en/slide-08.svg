<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Lesson 2: Read Sun and Shade</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 21</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="268.5">Lesson 2: Read Sun and Shade</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="339">In South Africa, the sun tracks across the northern</tspan><tspan x="96" y="403">sky.</tspan></text><circle cx="108" cy="454.8" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="467.3">North-facing slopes are warmer and drier. South-facing</tspan><tspan x="150" y="521.9">slopes are cooler and moister. On the Highveld, frost can sit</tspan><tspan x="150" y="576.4">in south-facing hollows long after it clears elsewhere.</tspan></text><circle cx="108" cy="619.6" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="632.2">This helps you choose where to place tender crops, trees,</tspan><tspan x="150" y="686.7">buildings, and other parts of your farm.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="609.5" height="8" fill="#B07A1E"/></svg>
