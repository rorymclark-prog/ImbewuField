<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Watch: Bees Moving Between Hive and Crops</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">9 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="88" fill="#1F4D2B"><tspan x="96" y="288.8">Watch: Bees Moving Between</tspan><tspan x="96" y="387.3">Hive and Crops</tspan></text><text class="lead" font-size="60" fill="#20190F"><tspan x="96" y="469.3">Watch the bees leave the hive and move among</tspan><tspan x="96" y="543.7">flowering crops.</tspan></text><circle cx="108" cy="604" r="9" fill="#B07A1E"/><text class="point" font-size="52" fill="#3A3020"><tspan x="150" y="618.5">Their movement carries pollen between flowers across</tspan><tspan x="150" y="682">the site.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="720" height="8" fill="#B07A1E"/></svg>
