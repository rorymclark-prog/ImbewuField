<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action: Put One Link to Work</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">SMALL LIVESTOCK INTEGRATION · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="88" fill="#F7F2E9"><tspan x="96" y="291.8">Field Action: Put One Link</tspan><tspan x="96" y="390.4">to Work</tspan></text><text class="lead" font-size="60" fill="#F7F2E9"><tspan x="96" y="472.4">Write down feed, water, shelter, daily care,</tspan><tspan x="96" y="546.8">useful outputs and any costs. A useful farm</tspan><tspan x="96" y="621.2">link must also meet the animal’s needs and</tspan><tspan x="96" y="695.6">protect food safety.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
