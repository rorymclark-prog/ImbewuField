<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Place the Hive With Care</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="241.2">Place the Hive With Care</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="311.7">Assess a possible hive site with an experienced local</tspan><tspan x="96" y="375.7">beekeeper before bringing bees onto the land.</tspan></text><circle cx="108" cy="427.5" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="440">Consider people, neighbours, livestock, paths, the flight</tspan><tspan x="150" y="494.6">path, water, forage, shelter and access for safe</tspan><tspan x="150" y="549.1">management. Morning sun may help, but one compass</tspan><tspan x="150" y="603.7">direction does not make a site safe.</tspan></text><circle cx="108" cy="646.9" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="659.4">Plan training and protective equipment as well as the hive</tspan><tspan x="150" y="714">position.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="960" height="8" fill="#B07A1E"/></svg>
