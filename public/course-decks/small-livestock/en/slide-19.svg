<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Assignment: Draw Your Farm Loop</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">SMALL LIVESTOCK INTEGRATION</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">19 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="79.2" fill="#F7F2E9"><tspan x="96" y="242.8">Field Assignment: Draw Your</tspan><tspan x="96" y="331.5">Farm Loop</tspan></text><text class="lead" font-size="54" fill="#F7F2E9"><tspan x="96" y="405.3">Walk your smallholding and choose an area where</tspan><tspan x="96" y="472.3">livestock could support another part of the system.</tspan></text><circle cx="108" cy="526.5" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="539.6">Record what food, scraps, pests, surplus produce, manure,</tspan><tspan x="150" y="596.7">or flowering resources are already present.</tspan></text><circle cx="108" cy="641.9" r="8.1" fill="#E3B65C"/><text class="point" font-size="46.8" fill="#CFC5AC"><tspan x="150" y="655">Then note what each animal could produce, and what it</tspan><tspan x="150" y="712.1">would need from the farm.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1520" height="8" fill="#E3B65C"/></svg>
