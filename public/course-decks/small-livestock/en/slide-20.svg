<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action: Put One Link to Work</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">SMALL LIVESTOCK INTEGRATION</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="77.4" fill="#F7F2E9"><tspan x="96" y="260.4">Field Action: Put One Link to Work</tspan></text><text class="lead" font-size="52.8" fill="#F7F2E9"><tspan x="96" y="332.6">Choose one safe action from this module.</tspan></text><circle cx="108" cy="385.6" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="398.4">Prepare an empty bed for chickens after harvest, check a</tspan><tspan x="150" y="454.2">possible hive position away from foot traffic, or identify where</tspan><tspan x="150" y="510.1">guinea fowl could hunt ticks.</tspan></text><circle cx="108" cy="554.3" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="567.1">Do not place chickens around seedlings.</tspan></text><circle cx="108" cy="611.3" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="624.1">Write down what the animal eats, what it produces, and what</tspan><tspan x="150" y="680">the farm supplies in return.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
