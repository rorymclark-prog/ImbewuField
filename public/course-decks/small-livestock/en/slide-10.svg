<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Bees Make Food Forests More Productive</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">10 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="251.2">Bees Make Food Forests More</tspan><tspan x="96" y="337.9">Productive</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="410.1">Bees and other flower visitors help pollinate many</tspan><tspan x="96" y="475.5">food crops. Dependence on insect visits differs</tspan><tspan x="96" y="541">between crops and cultivars.</tspan></text><circle cx="108" cy="594" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="606.8">In avocado, flowers have female and male phases.</tspan><tspan x="150" y="662.7">Suitable flowering overlap and pollen movement can</tspan><tspan x="150" y="718.5">support fruit set, but weather and tree condition matter too.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="800" height="8" fill="#B07A1E"/></svg>
