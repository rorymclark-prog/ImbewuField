<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>South Africa’s Native Honeybees</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="242.2">South Africa’s Native Honeybees</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="311.1">South Africa has Cape and African honeybee</tspan><tspan x="96" y="373.5">subspecies. Their natural ranges and movement</tspan><tspan x="96" y="436">restrictions matter when sourcing colonies.</tspan></text><circle cx="108" cy="486.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="498.9">Get help from an experienced local beekeeper before</tspan><tspan x="150" y="552.2">keeping or moving bees. Do not move colonies between</tspan><tspan x="150" y="605.5">regions on the strength of this lesson.</tspan></text><circle cx="108" cy="647.7" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="659.9">Both bee health and safe management need attention; a</tspan><tspan x="150" y="713.2">native colony is not automatically free of pests or disease.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="880" height="8" fill="#B07A1E"/></svg>
