<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Chickens Turn Scratching Into Useful Work</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">5 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="246">Chickens Turn Scratching Into</tspan><tspan x="96" y="334.7">Useful Work</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="408.5">Chickens forage and scratch through suitable</tspan><tspan x="96" y="475.4">areas, eating some insects and weed seeds. This</tspan><tspan x="96" y="542.4">does not replace balanced feed or health care.</tspan></text><circle cx="108" cy="596.6" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="609.7">Manure and bedding can become compost material when</tspan><tspan x="150" y="666.8">handled and composted properly. Fresh manure can</tspan><tspan x="150" y="723.9">carry disease-causing organisms.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="400" height="8" fill="#B07A1E"/></svg>
