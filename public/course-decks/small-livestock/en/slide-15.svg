<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Close the Nutrient Loop</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">15 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="253.7">Close the Nutrient Loop</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="327.5">On a conventional farm, bought feed comes in, meat</tspan><tspan x="96" y="394.4">and eggs leave, and manure becomes a waste</tspan><tspan x="96" y="461.4">problem.</tspan></text><circle cx="108" cy="515.6" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="528.7">On an integrated smallholding, chickens eat scraps, pest</tspan><tspan x="150" y="585.8">insects, and surplus produce.</tspan></text><circle cx="108" cy="631" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="644.1">They return their waste as fertility. Costs drop, value rises,</tspan><tspan x="150" y="701.2">and the same logic can guide ducks, guinea fowl, and bees.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1200" height="8" fill="#B07A1E"/></svg>
