<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">FOOD FOREST DESIGN</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="84.5" fill="#F7F2E9"><tspan x="96" y="265.6">Field Action</tspan></text><text class="lead" font-size="57.6" fill="#F7F2E9"><tspan x="96" y="344.3">Choose a plot and inspect the soil before</tspan><tspan x="96" y="415.7">planting.</tspan></text><circle cx="108" cy="473.6" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="487.5">Plan the sheet mulch with cardboard and wood chips.</tspan></text><circle cx="108" cy="535.8" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="549.7">Prepare your pioneer plants and nursery.</tspan></text><circle cx="108" cy="598" r="8.6" fill="#E3B65C"/><text class="point" font-size="49.9" fill="#CFC5AC"><tspan x="150" y="611.9">When the rainy season starts, plant the first sequence</tspan><tspan x="150" y="672.8">and watch which layers need the most care.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
