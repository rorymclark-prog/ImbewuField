<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>KZN Coast, Lowveld, and Limpopo</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="75.7" fill="#1F4D2B"><tspan x="96" y="253">KZN Coast, Lowveld, and Limpopo</tspan></text><text class="lead" font-size="51.6" fill="#20190F"><tspan x="96" y="323.5">KZN coast and Lowveld can suit mango, avocado, and</tspan><tspan x="96" y="387.5">Natal Mahogany.</tspan></text><circle cx="108" cy="439.3" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="451.8">Banana, pawpaw, litchi, and Wild Fig belong in the sub-canopy.</tspan></text><circle cx="108" cy="495" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="507.6">Barbados cherry and Wild Dagga belong in the shrub layer.</tspan></text><circle cx="108" cy="550.8" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="563.3">In Limpopo Lowveld, Marula, Mopane, and baobab may be</tspan><tspan x="150" y="617.8">appropriate.</tspan></text><circle cx="108" cy="661" r="7.7" fill="#B07A1E"/><text class="point" font-size="44.7" fill="#3A3020"><tspan x="150" y="673.6">These trees are edible and culturally significant.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="960" height="8" fill="#B07A1E"/></svg>
