<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Assignment</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">FOOD FOREST DESIGN</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">19 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="82.7" fill="#F7F2E9"><tspan x="96" y="245.4">Field Assignment</tspan></text><text class="lead" font-size="56.4" fill="#F7F2E9"><tspan x="96" y="322.5">Draw your own food forest in layers.</tspan></text><circle cx="108" cy="379.1" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="392.8">Mark the canopy, sub-canopy, shrub, herbaceous, ground</tspan><tspan x="150" y="452.4">cover, root crop, and climber spaces.</tspan></text><circle cx="108" cy="499.6" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="513.3">Write down your frost zone, rainfall, minimum winter</tspan><tspan x="150" y="573">temperature, frost frequency, and summer humidity.</tspan></text><circle cx="108" cy="620.2" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="633.9">Choose only species from this lesson that match your</tspan><tspan x="150" y="693.5">conditions.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1520" height="8" fill="#E3B65C"/></svg>
