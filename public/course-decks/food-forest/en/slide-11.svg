<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Highveld Food Forest Choices</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">11 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="239.2">Highveld Food Forest Choices</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="308.1">Highveld canopy choices include pecan, walnut, and</tspan><tspan x="96" y="370.6">indigenous fig.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="433.4">Apple, pear, plum, black mulberry, and loquat can form the</tspan><tspan x="150" y="486.7">sub-canopy.</tspan></text><circle cx="108" cy="528.9" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="541.1">Shrubs include rosemary, Wild Medlar, Cape gooseberry, and</tspan><tspan x="150" y="594.4">Barbados cherry.</tspan></text><circle cx="108" cy="636.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="648.9">Do not plant from a list alone. Check the conditions on your own</tspan><tspan x="150" y="702.2">land first.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="880" height="8" fill="#B07A1E"/></svg>
