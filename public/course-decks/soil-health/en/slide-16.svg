<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Cover Crops Between Seasons</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="255.6">Cover Crops Between Seasons</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="327.8">Cover crops protect soil when the main crop is not</tspan><tspan x="96" y="393.2">growing.</tspan></text><circle cx="108" cy="446.3" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="459.1">On the Highveld, oats or lupins sown after the maize harvest</tspan><tspan x="150" y="514.9">cover soil through frost months.</tspan></text><circle cx="108" cy="559.1" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="571.9">Slash them in before spring planting.</tspan></text><circle cx="108" cy="616.1" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="628.9">In KZN, sunn hemp grows fast in summer, while cowpea fixes</tspan><tspan x="150" y="684.8">nitrogen and tolerates the Lowveld’s early-summer dry spell.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1280" height="8" fill="#B07A1E"/></svg>
