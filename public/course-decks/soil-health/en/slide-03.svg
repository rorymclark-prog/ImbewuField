<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Learning Outcomes</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">SOIL HEALTH &amp; COMPOSTING</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="82.7" fill="#F7F2E9"><tspan x="96" y="248.7">Learning Outcomes</tspan></text><text class="lead" font-size="56.4" fill="#F7F2E9"><tspan x="96" y="325.8">You will learn how to recognise healthy and</tspan><tspan x="96" y="395.7">degraded soil.</tspan></text><circle cx="108" cy="452.3" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="466">You will use a jar test to see whether soil is mostly sand,</tspan><tspan x="150" y="525.7">silt, or clay.</tspan></text><circle cx="108" cy="572.9" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="586.6">You will make safer compost, correct a wet heap, protect</tspan><tspan x="150" y="646.2">bare ground, and use cover crops and worm-farm</tspan><tspan x="150" y="705.8">leachate wisely.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="240" height="8" fill="#E3B65C"/></svg>
