<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Keep Wattle Pods Out</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="245.4">Keep Wattle Pods Out</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="322.5">Keep wattle seed pods out of the compost heap.</tspan></text><circle cx="108" cy="379.1" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="392.8">Their hard seed coat can survive ordinary composting</tspan><tspan x="150" y="452.4">heat and carry the plant into finished compost.</tspan></text><circle cx="108" cy="499.6" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="513.3">Wattle bark alone is safe to include, although it breaks</tspan><tspan x="150" y="573">down slowly.</tspan></text><circle cx="108" cy="620.2" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="633.9">Turn the heap every five to seven days and keep it moist,</tspan><tspan x="150" y="693.5">not wet.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1040" height="8" fill="#B07A1E"/></svg>
