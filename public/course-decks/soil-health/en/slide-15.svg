<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Mulch Protects the Ground</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">15 / 20</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="255.6">Mulch Protects the Ground</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="327.8">Spread a 5 to 10cm layer of straw, dry grass, or wood</tspan><tspan x="96" y="393.2">chips over bare soil.</tspan></text><circle cx="108" cy="446.3" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="459.1">Mulch cuts erosion sharply and keeps soil several degrees</tspan><tspan x="150" y="514.9">cooler in summer.</tspan></text><circle cx="108" cy="559.1" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="571.9">On hot Highveld days, it can reduce soil temperature by up to</tspan><tspan x="150" y="627.7">10°C.</tspan></text><circle cx="108" cy="672" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="684.8">It also suppresses weeds and feeds soil life as it breaks down.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1200" height="8" fill="#B07A1E"/></svg>
