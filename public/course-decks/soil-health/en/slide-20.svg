<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">SOIL HEALTH &amp; COMPOSTING</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">20 / 20</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="82.7" fill="#F7F2E9"><tspan x="96" y="275.2">Field Action</tspan></text><text class="lead" font-size="56.4" fill="#F7F2E9"><tspan x="96" y="352.3">Start one soil-building action from this module.</tspan></text><circle cx="108" cy="408.9" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="422.6">Cover bare ground with mulch, begin a balanced compost</tspan><tspan x="150" y="482.2">heap, sow a suitable cover crop, or prepare a worm farm.</tspan></text><circle cx="108" cy="529.5" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="543.2">If your compost smells of ammonia and feels slimy, add</tspan><tspan x="150" y="602.8">dry carbon such as straw and turn it.</tspan></text><circle cx="108" cy="650" r="8.5" fill="#E3B65C"/><text class="point" font-size="48.9" fill="#CFC5AC"><tspan x="150" y="663.7">Build soil life step by step.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
