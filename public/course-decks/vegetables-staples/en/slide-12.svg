<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Staples Are Food Insurance</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">12 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="265.9">Staples Are Food Insurance</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="334.7">A staple earns its place because it feeds the household</tspan><tspan x="96" y="397.2">beyond the day of harvest.</tspan></text><circle cx="108" cy="447.8" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="460.1">It carries energy or protein. It stores, or it stays in the ground</tspan><tspan x="150" y="513.4">until you need it. And often it carries cultural memory too.</tspan></text><circle cx="108" cy="555.6" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="567.8">One staple leaves you vulnerable. Two or more give you</tspan><tspan x="150" y="621.1">options when weather or pests hit.</tspan></text><circle cx="108" cy="663.3" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="675.5">Grow at least two. Not one.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1066.7" height="8" fill="#B07A1E"/></svg>
