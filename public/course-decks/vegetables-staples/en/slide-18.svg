<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">VEGETABLES AND STAPLE CROPS</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">18 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="88" fill="#F7F2E9"><tspan x="96" y="276.5">Field Action</tspan></text><text class="lead" font-size="60" fill="#F7F2E9"><tspan x="96" y="358.5">This week, put one bed into production.</tspan></text><circle cx="108" cy="418.8" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="433.3">One. Mark the bed and the paths.</tspan></text><circle cx="108" cy="483.6" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="498.1">Two. Plant, with your spacing and your sowing rhythm.</tspan></text><circle cx="108" cy="548.4" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="562.9">Three. Return after ten days, with a photo.</tspan></text><rect x="96" y="710" width="1408" height="2" fill="rgba(247,242,233,0.22)"/><text class="q" fill="#E3B65C"><tspan x="96" y="781.9">Then observe. Adjust. And write it down.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
