<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Action</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">VEGETABLES AND STAPLE CROPS</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">18 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="77.4" fill="#F7F2E9"><tspan x="96" y="244.6">Field Action</tspan></text><text class="lead" font-size="52.8" fill="#F7F2E9"><tspan x="96" y="316.8">This week, put one bed into production.</tspan></text><circle cx="108" cy="369.8" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="382.6">One. Mark the bed and the paths.</tspan></text><circle cx="108" cy="426.8" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="439.6">Two. Plant, with your spacing and your sowing rhythm.</tspan></text><circle cx="108" cy="483.8" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="496.6">Three. Return after ten days, with a photo.</tspan></text><circle cx="108" cy="540.8" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="553.7">Then observe. Adjust. And write it down.</tspan></text><circle cx="108" cy="597.9" r="7.9" fill="#E3B65C"/><text class="point" font-size="45.8" fill="#CFC5AC"><tspan x="150" y="610.7">Record the sowing date. The rain. What germinated. Pest</tspan><tspan x="150" y="666.5">pressure. What you harvested.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
