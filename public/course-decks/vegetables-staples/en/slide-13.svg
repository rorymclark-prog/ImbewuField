<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Different Staples Protect Against Different Risks</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">13 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="255.7">Different Staples Protect Against</tspan><tspan x="96" y="338.5">Different Risks</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="407.4">Each staple protects you against something different.</tspan></text><circle cx="108" cy="458" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="470.2">Maize gives calories, and stores dry. Open-pollinated maize also</tspan><tspan x="150" y="523.5">lets you save your own seed, if you manage isolation and</tspan><tspan x="150" y="576.8">selection.</tspan></text><circle cx="108" cy="619" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="631.2">Beans and cowpeas give a storable protein harvest.</tspan></text><circle cx="108" cy="673.4" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="685.7">Sweet potato tolerates dry periods, and its leaves are edible too.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1155.6" height="8" fill="#B07A1E"/></svg>
