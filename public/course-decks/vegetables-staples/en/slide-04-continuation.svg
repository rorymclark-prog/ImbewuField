<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Roots Need Loose Soil, Paths Need Your Feet</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1 · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#8C7A62">4 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="249.3">Roots Need Loose Soil, Paths</tspan><tspan x="96" y="340">Need Your Feet</tspan></text><circle cx="108" cy="395.4" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="408.8">One metre to one point two metres wide. That's the working</tspan><tspan x="150" y="467.2">number. At that width you can reach the centre from either</tspan><tspan x="150" y="525.6">path, and your feet never touch the growing area.</tspan></text><rect x="96" y="594.1" width="1408" height="2" fill="#E2D8C4"/><text class="q" fill="#8A4B2A"><tspan x="96" y="666">Now think about your own beds. Can you reach the middle</tspan><tspan x="96" y="724">without stepping inside? Go and try it before you plant</tspan><tspan x="96" y="781.9">anything else.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="355.6" height="8" fill="#B07A1E"/></svg>
