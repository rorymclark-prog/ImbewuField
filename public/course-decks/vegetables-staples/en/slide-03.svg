<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Learning Outcomes</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">VEGETABLES AND STAPLE CROPS</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">3 / 18</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="72.2" fill="#F7F2E9"><tspan x="96" y="237.6">Learning Outcomes</tspan></text><text class="lead" font-size="49.2" fill="#F7F2E9"><tspan x="96" y="304.8">By the end of this module, you'll be able to make four</tspan><tspan x="96" y="365.8">decisions in your own field.</tspan></text><circle cx="108" cy="415.2" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="427.2">One. Build the right bed — matching the width and the bed type to</tspan><tspan x="150" y="479.2">your soil and your rainfall.</tspan></text><circle cx="108" cy="520.4" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="532.3">Two. Keep harvests moving, using succession planting and</tspan><tspan x="150" y="584.4">intercropping.</tspan></text><circle cx="108" cy="625.5" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="637.5">Three. Choose staples that protect you when one crop fails.</tspan></text><circle cx="108" cy="678.7" r="7.4" fill="#E3B65C"/><text class="point" font-size="42.6" fill="#CFC5AC"><tspan x="150" y="690.6">Four. Read a pest problem before you treat it.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="266.7" height="8" fill="#E3B65C"/></svg>
