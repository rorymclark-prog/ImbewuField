<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Treat the Cause Before the Insect</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 4 · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="246.6">Treat the Cause Before the</tspan><tspan x="96" y="339.3">Insect</tspan></text><circle cx="108" cy="395.9" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="409.6">Four. Only then, act — and start with the lightest thing that</tspan><tspan x="150" y="469.2">works. Physical removal and better plant health solve</tspan><tspan x="150" y="528.9">most small outbreaks.</tspan></text><rect x="96" y="594.1" width="1408" height="2" fill="#E2D8C4"/><text class="q" fill="#8A4B2A"><tspan x="96" y="666">If you use a neem product, follow the label. Don't improvise a</tspan><tspan x="96" y="724">stronger mixture. Even lower-risk products harm the wrong</tspan><tspan x="96" y="781.9">insects when they're misused.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1422.2" height="8" fill="#B07A1E"/></svg>
