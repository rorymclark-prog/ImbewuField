<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Treat the Cause Before the Insect</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 4 · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="79.2" fill="#1F4D2B"><tspan x="96" y="279.4">Treat the Cause Before the</tspan><tspan x="96" y="368.1">Insect</tspan></text><text class="lead" font-size="54" fill="#20190F"><tspan x="96" y="441.9">Three. Protect what's helping you. Beneficial</tspan><tspan x="96" y="508.9">insects are doing work you'd otherwise do yourself.</tspan></text><circle cx="108" cy="563.1" r="8.1" fill="#B07A1E"/><text class="point" font-size="46.8" fill="#3A3020"><tspan x="150" y="576.2">Four. Only then, act — and start with the lightest thing</tspan><tspan x="150" y="633.3">that works. Physical removal and better plant health</tspan><tspan x="150" y="690.4">solve most small outbreaks.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1422.2" height="8" fill="#B07A1E"/></svg>
