<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Roots Need Loose Soil, Paths Need Your Feet</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">4 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="77.4" fill="#1F4D2B"><tspan x="96" y="243.3">Roots Need Loose Soil, Paths</tspan><tspan x="96" y="330">Need Your Feet</tspan></text><text class="lead" font-size="52.8" fill="#20190F"><tspan x="96" y="402.2">Compacted soil loses its air spaces. Roots slow down.</tspan><tspan x="96" y="467.6">Water soaks in differently. The bed gets harder to work</tspan><tspan x="96" y="533.1">every season.</tspan></text><circle cx="108" cy="586.1" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="598.9">The protection is simple. Permanent paths, and a bed narrow</tspan><tspan x="150" y="654.7">enough to reach into from both sides.</tspan></text><circle cx="108" cy="699" r="7.9" fill="#B07A1E"/><text class="point" font-size="45.8" fill="#3A3020"><tspan x="150" y="711.8">One metre to one point two metres wide.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="355.6" height="8" fill="#B07A1E"/></svg>
