<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Seed or Seedling?</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">6 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="250.7">Seed or Seedling?</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="318">Some crops do better sown straight where they will</tspan><tspan x="96" y="379">grow. Beans, carrots and maize belong in that group.</tspan><tspan x="96" y="440">Tomatoes and brassicas can start in a protected nursery</tspan><tspan x="96" y="501">before transplanting.</tspan></text><circle cx="108" cy="550.4" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="562.3">Use guidance for the actual crop and cultivar, then check</tspan><tspan x="150" y="614.4">spacing against local soil, water, season and mature size. Do</tspan><tspan x="150" y="666.4">not assume every seed packet was written for a cooler, wetter</tspan><tspan x="150" y="718.4">country. Keep paths and enough room to tend the plants.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="533.3" height="8" fill="#B07A1E"/></svg>
