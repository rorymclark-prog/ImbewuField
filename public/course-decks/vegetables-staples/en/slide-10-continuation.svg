<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Each Crop Earns Its Place</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 2 · CONTINUED</text><text class="eye num" x="1504" y="88" fill="#8C7A62">10 / 18</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="248.7">Each Crop Earns Its Place</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="325.8">Pumpkin spreads across the ground, shading the</tspan><tspan x="96" y="395.7">soil and holding moisture.</tspan></text><circle cx="108" cy="452.3" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="466">Timing matters. Establish the maize first, so it's strong</tspan><tspan x="150" y="525.7">enough to carry the beans when they start to climb.</tspan></text><circle cx="108" cy="572.9" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="586.6">Three crops share one piece of ground, but they can</tspan><tspan x="150" y="646.2">still compete for light, water and nutrients. Watch their</tspan><tspan x="150" y="705.8">growth and adjust spacing and timing.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="888.9" height="8" fill="#B07A1E"/></svg>
