<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Watch: First Flush to Tank</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">16 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="88" fill="#1F4D2B"><tspan x="96" y="337.5">Watch: First Flush to Tank</tspan></text><text class="lead" font-size="60" fill="#20190F"><tspan x="96" y="419.5">A first-flush diverter removes the dirty first flush</tspan><tspan x="96" y="493.9">from every rain event.</tspan></text><rect x="96" y="652.1" width="1408" height="2" fill="#E2D8C4"/><text class="q" fill="#8A4B2A"><tspan x="96" y="724">The first 20 to 30 litres should be diverted before clean water</tspan><tspan x="96" y="782">reaches the tank.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1066.7" height="8" fill="#B07A1E"/></svg>
