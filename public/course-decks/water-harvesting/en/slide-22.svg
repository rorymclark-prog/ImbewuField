<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Use Greywater Only Where It Is Safe</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 4</text><text class="eye num" x="1504" y="88" fill="#8C7A62">22 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="72.2" fill="#1F4D2B"><tspan x="96" y="273.9">Use Greywater Only Where It Is Safe</tspan></text><text class="lead" font-size="49.2" fill="#20190F"><tspan x="96" y="341.1">Never use greywater on leafy vegetables, root vegetables</tspan><tspan x="96" y="402.1">eaten raw, or seedlings — the risk of contact with bacteria is</tspan><tspan x="96" y="463.1">too high.</tspan></text><circle cx="108" cy="512.5" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="524.5">Fruit trees, established shrubs, and non-edible landscaping are the</tspan><tspan x="150" y="576.5">right use.</tspan></text><circle cx="108" cy="617.7" r="7.4" fill="#B07A1E"/><text class="point" font-size="42.6" fill="#3A3020"><tspan x="150" y="629.6">Check your municipality's rules before installing a permanent</tspan><tspan x="150" y="681.6">greywater system.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1466.7" height="8" fill="#B07A1E"/></svg>
