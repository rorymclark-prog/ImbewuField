<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Match Tank Size to the Dry Season</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">17 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="84.5" fill="#1F4D2B"><tspan x="96" y="257.4">Match Tank Size to the Dry</tspan><tspan x="96" y="352">Season</tspan></text><text class="lead" font-size="57.6" fill="#20190F"><tspan x="96" y="430.7">Match tank size to your dry season, not just one dry</tspan><tspan x="96" y="502.1">spell.</tspan></text><circle cx="108" cy="560" r="8.6" fill="#B07A1E"/><text class="point" font-size="49.9" fill="#3A3020"><tspan x="150" y="573.9">In KZN, 5,000 litres may bridge a two-to-three-week gap.</tspan></text><circle cx="108" cy="622.2" r="8.6" fill="#B07A1E"/><text class="point" font-size="49.9" fill="#3A3020"><tspan x="150" y="636.1">On the Highveld's longer dry season, 20,000 to 30,000</tspan><tspan x="150" y="697">litres is more realistic.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1133.3" height="8" fill="#B07A1E"/></svg>
