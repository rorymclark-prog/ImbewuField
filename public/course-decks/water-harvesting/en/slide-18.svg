<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Keep Stored Water Protected</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">18 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="88" fill="#1F4D2B"><tspan x="96" y="358">Keep Stored Water Protected</tspan></text><text class="lead" font-size="60" fill="#20190F"><tspan x="96" y="440">Keep tanks sealed against light and mosquitoes.</tspan></text><circle cx="108" cy="500.2" r="9" fill="#B07A1E"/><text class="point" font-size="52" fill="#3A3020"><tspan x="150" y="514.8">Filter before drinking.</tspan></text><rect x="96" y="710" width="1408" height="2" fill="#E2D8C4"/><text class="q" fill="#8A4B2A"><tspan x="96" y="781.9">For drinking water, add a filter downstream.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1200" height="8" fill="#B07A1E"/></svg>
