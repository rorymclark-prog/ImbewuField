<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Know When Swales Fit the Slope</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">8 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="86.2" fill="#1F4D2B"><tspan x="96" y="249.2">Know When Swales Fit the</tspan><tspan x="96" y="345.8">Slope</tspan></text><text class="lead" font-size="58.8" fill="#20190F"><tspan x="96" y="426.2">Swales work well on 1 to 15% slopes.</tspan></text><circle cx="108" cy="485.2" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="499.5">Above 15 to 20%, use vetiver grass contour lines or</tspan><tspan x="150" y="561.7">terraces instead.</tspan></text><circle cx="108" cy="610.9" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="625.2">Test a 60cm pit with water first.</tspan></text><circle cx="108" cy="674.4" r="8.8" fill="#B07A1E"/><text class="point" font-size="51" fill="#3A3020"><tspan x="150" y="688.7">If it drains within the hour, plan for drier conditions.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="533.3" height="8" fill="#B07A1E"/></svg>
