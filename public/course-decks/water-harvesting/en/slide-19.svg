<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Greywater Is Washwater, Not Toilet Water</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 4</text><text class="eye num" x="1504" y="88" fill="#8C7A62">19 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="265.3">Greywater Is Washwater, Not</tspan><tspan x="96" y="358">Toilet Water</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="435.1">Greywater is used washwater from your bath, basin,</tspan><tspan x="96" y="505">and laundry — not toilet water, which is blackwater</tspan><tspan x="96" y="574.9">and needs separate, careful handling.</tspan></text><circle cx="108" cy="631.6" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="645.2">Kept clean of harsh chemicals, greywater is a free daily</tspan><tspan x="150" y="704.9">source of irrigation water that would otherwise be wasted.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1266.7" height="8" fill="#B07A1E"/></svg>
