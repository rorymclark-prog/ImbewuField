<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Learning Outcomes</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">WATER HARVESTING</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">2 / 24</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="73.9" fill="#F7F2E9"><tspan x="96" y="239.2">Learning Outcomes</tspan></text><text class="lead" font-size="50.4" fill="#F7F2E9"><tspan x="96" y="308.1">A swale is a level trench on contour — it sinks water, it</tspan><tspan x="96" y="370.6">doesn't direct it.</tspan></text><circle cx="108" cy="421.2" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="433.4">Design the spillway before the wall — an overtopped wall can</tspan><tspan x="150" y="486.7">breach catastrophically.</tspan></text><circle cx="108" cy="528.9" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="541.1">A first-flush diverter removes the dirty first flush from every rain</tspan><tspan x="150" y="594.4">event.</tspan></text><circle cx="108" cy="636.6" r="7.6" fill="#E3B65C"/><text class="point" font-size="43.7" fill="#CFC5AC"><tspan x="150" y="648.9">Direct greywater to mulch basins around fruit trees, never onto</tspan><tspan x="150" y="702.2">raw-eaten vegetables.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="133.3" height="8" fill="#E3B65C"/></svg>
