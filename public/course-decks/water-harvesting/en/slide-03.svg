<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Swales Slow Water on the Slope</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 1</text><text class="eye num" x="1504" y="88" fill="#8C7A62">3 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="273.4">Swales Slow Water on the Slope</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="350.5">A swale is a level trench dug exactly on contour —</tspan><tspan x="96" y="420.4">not angled, perfectly level end to end — so water</tspan><tspan x="96" y="490.3">fills it evenly and soaks in rather than running off.</tspan></text><circle cx="108" cy="547" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="560.6">The excavated soil forms a berm on the downhill side.</tspan></text><circle cx="108" cy="607.9" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="621.5">Trees planted there draw on stored water long after the</tspan><tspan x="150" y="681.2">rain has stopped.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="200" height="8" fill="#B07A1E"/></svg>
