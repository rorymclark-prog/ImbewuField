<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Divert the Dirty First Flush</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">15 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="81" fill="#1F4D2B"><tspan x="96" y="248.6">Divert the Dirty First Flush</tspan></text><text class="lead" font-size="55.2" fill="#20190F"><tspan x="96" y="324">Roof runoff can carry droppings, dust and other</tspan><tspan x="96" y="392.5">contamination. Divert the first runoff before it</tspan><tspan x="96" y="460.9">enters the tank.</tspan></text><circle cx="108" cy="516.4" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="529.8">The amount to divert depends on roof area and local</tspan><tspan x="150" y="588.1">conditions. Follow a suitable design and the device</tspan><tspan x="150" y="646.5">instructions; there is no single volume for every roof.</tspan></text><circle cx="108" cy="692.7" r="8.3" fill="#B07A1E"/><text class="point" font-size="47.8" fill="#3A3020"><tspan x="150" y="706.1">A first-flush diverter does not make water safe to drink.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1000" height="8" fill="#B07A1E"/></svg>
