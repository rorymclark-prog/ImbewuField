<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Field Assignment</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">WATER HARVESTING</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">23 / 24</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="88" fill="#F7F2E9"><tspan x="96" y="329">Field Assignment</tspan></text><text class="lead" font-size="60" fill="#F7F2E9"><tspan x="96" y="411">Build an A-frame level from three poles and a</tspan><tspan x="96" y="485.4">weighted string.</tspan></text><circle cx="108" cy="545.7" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="560.2">Use it to find one level line across your slope.</tspan></text><circle cx="108" cy="610.5" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="625">Photograph the A-frame and the line you marked.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1533.3" height="8" fill="#E3B65C"/></svg>
