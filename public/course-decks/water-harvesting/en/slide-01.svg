<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Water Harvesting</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">IMBEWUFIELD · HOME-STUDY MODULE</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">1 / 24</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="hero" fill="#F7F2E9"><tspan x="96" y="301.6">Water Harvesting</tspan></text><rect x="96" y="343.1" width="6" height="301.6" fill="#E3B65C"/><text class="tag" fill="#CFC5AC"><tspan x="130" y="404">Swales, berms, dams, rainwater tanks</tspan><tspan x="130" y="479.4">and greywater. Choose where to slow</tspan><tspan x="130" y="554.8">water, where it can soak in, and where</tspan><tspan x="130" y="630.2">excess water can leave safely.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="66.7" height="8" fill="#E3B65C"/></svg>
