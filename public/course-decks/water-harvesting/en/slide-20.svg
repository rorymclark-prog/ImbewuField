<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Keep Greywater Safe for Soil</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 4</text><text class="eye num" x="1504" y="88" fill="#8C7A62">20 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="82.7" fill="#1F4D2B"><tspan x="96" y="281.8">Keep Greywater Safe for Soil</tspan></text><text class="lead" font-size="56.4" fill="#20190F"><tspan x="96" y="358.9">Use plain soap and avoid bleach, strong</tspan><tspan x="96" y="428.8">disinfectants, or water from washing nappies —</tspan><tspan x="96" y="498.8">these can damage soil life and plant roots.</tspan></text><circle cx="108" cy="555.4" r="8.5" fill="#B07A1E"/><text class="point" font-size="48.9" fill="#3A3020"><tspan x="150" y="569.1">Direct greywater into a mulch-filled basin around fruit</tspan><tspan x="150" y="628.7">trees rather than onto bare ground, so it filters through</tspan><tspan x="150" y="688.4">organic matter before reaching roots.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="1333.3" height="8" fill="#B07A1E"/></svg>
