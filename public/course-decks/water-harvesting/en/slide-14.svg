<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Your Roof Is a Harvesting Surface</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#F7F2E9"/><text class="eye" font-size="30" x="96" y="88" fill="#B07A1E">LESSON 3</text><text class="eye num" x="1504" y="88" fill="#8C7A62">14 / 24</text><rect x="96" y="106" width="88" height="5" fill="#B07A1E"/><text class="title" font-size="73.9" fill="#1F4D2B"><tspan x="96" y="263.3">Your Roof Is a Harvesting</tspan><tspan x="96" y="346.1">Surface</tspan></text><text class="lead" font-size="50.4" fill="#20190F"><tspan x="96" y="414.9">Your roof is a harvesting surface.</tspan></text><circle cx="108" cy="465.5" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="477.8">Each square metre collects roughly 0.9 litres per millimetre of</tspan><tspan x="150" y="531.1">rain, once you allow for splash and evaporation losses.</tspan></text><circle cx="108" cy="573.3" r="7.6" fill="#B07A1E"/><text class="point" font-size="43.7" fill="#3A3020"><tspan x="150" y="585.5">A 100 square metre corrugated iron roof in Pietermaritzburg,</tspan><tspan x="150" y="638.8">at 800mm a year, yields close to 72,000 litres — enough for a</tspan><tspan x="150" y="692.1">family garden and most non-drinking needs.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="#E2D8C4"/><rect x="0" y="892" width="933.3" height="8" fill="#B07A1E"/></svg>
