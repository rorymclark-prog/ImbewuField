<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><title>Check Your Work</title><style>.eye{font:700 30px 'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;letter-spacing:3.4px}.num{text-anchor:end;letter-spacing:2px}.hero{font:700 132px Georgia,'Iowan Old Style','Times New Roman',serif}.tag{font:italic 400 58px Georgia,'Iowan Old Style','Times New Roman',serif}.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-weight:700}.lead{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.point{font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;font-weight:400}.q{font:italic 400 46px Georgia,'Iowan Old Style','Times New Roman',serif}</style><rect width="1600" height="900" fill="#173B21"/><text class="eye" font-size="30" x="96" y="88" fill="#E3B65C">WATER HARVESTING</text><text class="eye num" x="1504" y="88" fill="#CFC5AC">24 / 24</text><rect x="96" y="106" width="88" height="5" fill="#E3B65C"/><text class="title" font-size="88" fill="#F7F2E9"><tspan x="96" y="253.1">Check Your Work</tspan></text><text class="lead" font-size="60" fill="#F7F2E9"><tspan x="96" y="335.1">My A-frame is built and I have tested it.</tspan></text><circle cx="108" cy="395.3" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="409.9">Turn it around — it should read the same.</tspan></text><circle cx="108" cy="460.1" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="474.7">I have marked at least three points at the same height</tspan><tspan x="150" y="538.1">across my slope.</tspan></text><circle cx="108" cy="588.4" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="602.9">My marked line runs across the slope, not down it.</tspan></text><circle cx="108" cy="653.2" r="9" fill="#E3B65C"/><text class="point" font-size="52" fill="#CFC5AC"><tspan x="150" y="667.7">Realistic minimum time for the real work: 5 days.</tspan></text><rect x="0" y="892" width="1600" height="8" fill="rgba(247,242,233,0.14)"/><rect x="0" y="892" width="1600" height="8" fill="#E3B65C"/></svg>
