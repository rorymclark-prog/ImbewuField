<style>
#courtyard-zones-map{display:grid;gap:calc(var(--font-size-base)*.75);color:var(--foreground)}
#courtyard-zones-map .map-scene{position:relative;isolation:isolate}
#courtyard-zones-map .map-scene img{display:block;width:100%;height:auto}
#courtyard-zones-map .zone-areas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#courtyard-zones-map polygon{fill-opacity:.14;stroke-width:2;vector-effect:non-scaling-stroke;stroke-opacity:.85}
#courtyard-zones-map [data-area="0"]{fill:var(--viz-series-1);stroke:var(--viz-series-1)}
#courtyard-zones-map [data-area="1"]{fill:var(--viz-series-2);stroke:var(--viz-series-2)}
#courtyard-zones-map [data-area="2"]{fill:var(--viz-series-3);stroke:var(--viz-series-3)}
#courtyard-zones-map [data-area="3"]{fill:var(--viz-series-4);stroke:var(--viz-series-4)}
#courtyard-zones-map [data-area="4"]{fill:var(--viz-series-5);stroke:var(--viz-series-5)}
#courtyard-zones-map [data-area="5"]{fill:var(--viz-series-6);stroke:var(--viz-series-6)}
#courtyard-zones-map [data-marker]{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:calc(var(--font-size-base)*2);height:calc(var(--font-size-base)*2);border-radius:50%;background:var(--background);color:var(--foreground);font-weight:500;pointer-events:none}
#courtyard-zones-map .is-muted{opacity:.3}
</style>
<script>
(()=>{
const root=document.getElementById('courtyard-zones-map');
const descriptions={all:'Zones run 0 to 5 by how often you visit.',0:'Zone 0 is the house.',1:'In this example, Zone 1 is near the house and holds what you pick often — herbs, salad greens.',2:'Zone 2 is the main garden and chicken run, visited once or twice a day.',3:'Zone 3 is the main field, visited weekly.',4:'Zone 4 is semi-wild — fruit trees and fodder needing occasional attention.',5:'Zone 5 is left wild.'};
function show(zone,persist=false){
 if(!Object.prototype.hasOwnProperty.call(descriptions,zone))zone='all';
 root.querySelectorAll('[data-zone]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.zone===zone)));
 root.querySelectorAll('[data-area]').forEach(p=>{const active=zone==='all'||p.dataset.area===zone;p.style.fillOpacity=active?(zone==='all'?'.14':'.28'):'0';p.style.strokeOpacity=active?'.95':'0';});
 root.querySelectorAll('[data-marker]').forEach(m=>m.classList.toggle('is-muted',zone!=='all'&&m.dataset.marker!==zone));
 root.querySelector('.zone-detail').textContent=descriptions[zone];
 if(persist&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{selectedZone:zone},privateContent:null}).catch(()=>{});
}
root.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.zone,true)));
show(window.openai?.widgetState?.modelContent?.selectedZone||'all');
window.addEventListener('openai:set_globals',e=>show(e.detail?.globals?.widgetState?.modelContent?.selectedZone||'all'));
})();
</script>
