name: Deploy ImbewuField

# Push to main → rename project to "imbewufield" (idempotent), deploy, alias domains.
# Live URLs: imbewufield.vercel.app + permamap-sa.vercel.app
# org/project IDs are public; build env comes from `vercel pull`.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_7BrNEJFlmUBuWXhpUGXMs3cl
      VERCEL_PROJECT_ID: prj_YIOnoi39oQlq6r0pDecV8wPHn4EP
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Add VERCEL_TOKEN secret to enable auto-deploy."
            echo "HAS=false" >> "$GITHUB_ENV"
          else
            echo "HAS=true" >> "$GITHUB_ENV"
          fi
      - name: Rename Vercel project to imbewufield
        if: env.HAS == 'true'
        run: |
          curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"imbewufield"}' | grep -o '"name":"[^"]*"' | head -1
      - uses: actions/setup-node@v4
        if: env.HAS == 'true'
        with:
          node-version: '20'
      - name: Install Vercel CLI
        if: env.HAS == 'true'
        run: npm install -g vercel@latest
      - name: Pull + build + deploy
        if: env.HAS == 'true'
        id: deploy
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          # --archive=tgz UPLOADS ONE TARBALL INSTEAD OF ~500 SEPARATE FILES, and it is the
          # difference between deploying and not deploying at all.
          #
          # On 2026-07-28 every deploy — prod and preview — began failing with
          # `Too many requests … (more than 5000, code: "api-upload-free")`. The free plan counts
          # UPLOADED FILES per 24h, and public/ alone is 206 files (62 MB of course audio,
          # animations and decks) before the .next chunks. That puts the ceiling at roughly ten
          # deploys a day across the whole repo, which a two-agent day passes before lunch.
          #
          # It hid because the BUILD still succeeded — only the upload failed, at the very end. So
          # the run was red in a place nobody reads, production sat 23 commits behind for hours,
          # and the farmer's update banner correctly showed nothing: there was genuinely no new
          # build to tell them about. Vercel's own error message recommends this flag; the whole
          # deployment then counts as one upload.
          url=$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed → $url"
      - name: Point all domains at the new deployment
        if: env.HAS == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          vercel alias set "$url" imbewufield.vercel.app --token="$VERCEL_TOKEN"
          vercel alias set "$url" permamap-sa.vercel.app --token="$VERCEL_TOKEN"

      # PROVE THE LIVE SITE IS SERVING THIS COMMIT. Green CI meant "a deploy was attempted", which
      # is not the thing anyone cares about — on 2026-07-28 production served a build 23 commits
      # old while the runs looked broadly fine. /api/build-info is the same endpoint the farmer's
      # update banner polls, so this asserts exactly what the banner would tell them.
      - name: Verify imbewufield.vercel.app is serving this commit
        if: env.HAS == 'true'
        run: |
          want="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          for attempt in 1 2 3 4 5 6; do
            got=$(curl -fsS "https://imbewufield.vercel.app/api/build-info?ci=$attempt" \
              -H 'Cache-Control: no-cache' | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p') || got=""
            if [ "$got" = "$want" ]; then
              echo "Live build is $got — matches this commit."
              exit 0
            fi
            echo "Attempt $attempt: live build is '${got:-unreachable}', want '$want'. Waiting…"
            sleep 10
          done
          echo "::error::imbewufield.vercel.app is still serving '${got:-unreachable}', not $want. Production did NOT update."
          exit 1
