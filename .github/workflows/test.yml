name: Tests

# Until now NOTHING ran the test suite automatically. The three deploy workflows
# build and ship; none of them calls `npm test` or `tsc`. So 487 tests only ever
# ran on Rory's Mac, and any contributor who could not run them locally — a cloud
# Codex sandbox, a cloud Claude session, Rory on his phone — was shipping blind.
#
# That is the whole reason this file exists. A cloud agent does not need a working
# local toolchain if pushing is itself the verification.
#
# NODE VERSION IS LOAD-BEARING. The tests are TypeScript and are loaded by Node's
# native type stripping (see tests/register-alias.mjs — it only registers the '@/'
# alias resolver; it does NOT transpile). Type stripping is on by default from
# Node 22.18 / 23.6 onward. On Node 20 every test file fails to load with
# ERR_UNKNOWN_FILE_EXTENSION — which is exactly what cloud Codex kept reporting
# and mistaking for a broken repo. The deploy workflows stay on 20 because Vercel
# builds are fine there; this one must not.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because the release-notes drift check below asks git what has
          # landed since the sha the notes were stamped with. actions/checkout defaults to
          # a depth-1 clone, which holds neither that commit nor any history to walk, so
          # the check died on "fatal: bad revision <sha>..HEAD" — and because it was made
          # blocking on main (2026-08-03), that turned the whole Tests job red on every
          # push for a reason that had nothing to do with any test.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # THE UPDATE BANNER GOES STALE UNLESS SOMETHING ASKS. scripts/release-notes-pending.mjs was
      # written on 2 August for exactly this complaint and then wired to nothing, so on 3 August
      # Rory hit it again: "still old updates on the refresh button please oh please fix". The
      # banner was telling the truth both times — RELEASE_NOTES simply had not been written since.
      #
      # Blocking on main, advisory elsewhere. A work-in-progress branch push should not fail CI
      # for having no farmer note yet — but a push to main IS a production deploy, and the fourth
      # recurrence of "STILL shows old updates" (4 August) proved visibility alone does not make
      # anyone write the notes. If user-facing code ships to main, the note ships in the same push.
      - name: Pending release notes
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        run: npm run notes:pending

      # Deliberately NOT running `npm run build` here. app/layout.tsx imports
      # Newsreader and Public Sans via next/font/google, so a build needs network
      # access to fonts.googleapis.com at compile time. It succeeds on Vercel and
      # in the deploy workflows; it fails in any network-restricted sandbox, and
      # chasing that failure has already cost real time. Build coverage comes from
      # deploy-preview.yml, which runs on the same push.

  # ITS OWN JOB, AND THAT IS THE WHOLE POINT.
  #
  # THE RULES TESTS HAVE NEVER RUN IN CI. tests/firestore-rules.test.ts is deliberately outside
  # `npm test` (it needs the Firestore emulator, so it lives in EXTERNAL_TEST_FILES), and no
  # workflow invoked `test:rules` — so a test asserting that a self-signed-up mentor cannot read
  # every farmer's sales figures sat there failing, silently, while the rules shipped.
  # A security rule with no enforced test is a comment.
  #
  # It used to be the last step of the `test` job, downstream of the release-notes gate. On main
  # that gate is blocking, so when it failed the job stopped and these steps never ran — which is
  # exactly what happened on all six merges of 6 August. A security check that a cosmetic check can
  # switch off is not a check. Separating the jobs makes that structurally impossible: no ordering,
  # no gate and no future step in `test` can skip this one, because it no longer shares their fate.
  #
  # The emulator needs a JVM and the Firebase CLI, neither of which is on the runner. The CLI is
  # installed here rather than added to package.json: it is a ~100 MB tool used by one CI step
  # and by Rory locally, and putting it in devDependencies would tax every `npm ci` in every
  # other workflow for it. Pinned, because an unpinned global install is a build that changes
  # under you. Pinned to the SAME major Rory runs locally (15) so a rules change that passes on
  # his machine cannot fail here for a reason that is only a CLI version.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'  # firebase-tools 15 refuses anything below 21

      - name: Install
        run: npm ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@15

      - name: Firestore rules
        run: npm run test:rules

      # Storage rules ride in the SAME job for the same reason the job exists. /photos/** was
      # world-readable and the rules file said that was required for reports to work; it was not,
      # and nothing anywhere proved either claim. This step is what stops that being true again.
      - name: Storage rules
        run: npm run test:storage-rules

      # Tenant-2-onboarding provisioning path (scripts/provision-org.mjs, scripts/seed.mjs).
      # Needs Auth as well as Firestore — resolveAccount() looks grantees/attachees up by
      # email via the Auth emulator, unlike the rules-unit-testing suites above which simulate
      # auth contexts themselves and never touch a real Auth emulator.
      - name: Org provisioning
        run: npm run test:provisioning
