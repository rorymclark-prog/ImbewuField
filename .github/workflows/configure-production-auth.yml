name: Configure production sign-in domains

on:
  push:
    branches: [main]
    paths:
      - scripts/configure-production-auth.mjs
      - .github/workflows/configure-production-auth.yml

concurrency:
  group: production-auth-configuration
  cancel-in-progress: false

jobs:
  configure:
    if: github.repository == 'rorymclark-prog/ImbewuField'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install trusted dependencies
        run: npm ci --ignore-scripts
      - name: Read Google provider and production domains
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/configure-production-auth.mjs
      - name: Add missing production domains and verify read-back
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/configure-production-auth.mjs --apply
