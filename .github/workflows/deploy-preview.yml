name: Deploy preview

# Every push to a non-main branch → Vercel PREVIEW deploy, then point the stable
# preview domain at it. This is the CI twin of the manual `vercel deploy` +
# `vercel alias set … imbewufield-preview.vercel.app` flow — it exists so cloud
# Claude sessions (claude.ai/code) and any other laptop-free contributor can
# ship testable builds by pushing alone. Production is deliberately NOT touched
# here: main → prod stays in deploy.yml.
# Live URL: imbewufield-preview.vercel.app

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_7BrNEJFlmUBuWXhpUGXMs3cl
      VERCEL_PROJECT_ID: prj_YIOnoi39oQlq6r0pDecV8wPHn4EP
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::Add VERCEL_TOKEN secret to enable preview auto-deploy."
            echo "HAS=false" >> "$GITHUB_ENV"
          else
            echo "HAS=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        if: env.HAS == 'true'
        with:
          node-version: '20'
      - name: Install Vercel CLI
        if: env.HAS == 'true'
        run: npm install -g vercel@latest
      - name: Pull + build + deploy (preview)
        if: env.HAS == 'true'
        id: deploy
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed preview → $url"
      # ONE STABLE URL PER BRANCH. Originally every branch aliased imbewufield-preview, which in a
      # multi-agent repo is last-push-wins: on 2026-07-26 Codex aliased its drawing-quality build
      # and asked Rory to test it, then a push on the integration branch silently replaced it —
      # so he would have tested the wrong code and reported on the wrong build. Each branch now
      # owns its own hostname, and only the integration branch also holds the canonical
      # imbewufield-preview name (the URL everyone already has).
      - name: Point this branch's stable domain at it
        if: env.HAS == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          # Branch → hostname slug: strip the owner prefix (codex/, claude/, feat/), lowercase,
          # non-alphanumerics to '-', trim, cap at 40 chars so the hostname stays valid.
          slug=$(printf '%s' "${GITHUB_REF_NAME#*/}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9]\+/-/g' -e 's/^-//' -e 's/-$//' \
            | cut -c1-40)
          vercel alias set "$url" "imbewufield-$slug.vercel.app" --token="$VERCEL_TOKEN"
          echo "imbewufield-$slug.vercel.app → $url (branch ${GITHUB_REF_NAME})"
          if [ "${GITHUB_REF_NAME}" = "codex/reference-blueprint-quality" ]; then
            vercel alias set "$url" imbewufield-preview.vercel.app --token="$VERCEL_TOKEN"
            echo "imbewufield-preview.vercel.app → $url (canonical integration build)"
          fi
